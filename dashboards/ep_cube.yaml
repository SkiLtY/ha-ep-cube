        cards:
          - type: custom:html-template-card
            grid_options:
              columns: 18
            ignore_line_breaks: true
            content: |
              {% macro tile(label, value, unit, color) -%}
              <div style="border-left:3px solid {{ color }};padding:2px 0 2px 12px"><div style="font-size:12px;letter-spacing:.04em;text-transform:uppercase;opacity:.6">{{ label }}</div><div style="font-size:28px;font-weight:600;line-height:1.25">{{ value }}<span style="font-size:13px;font-weight:400;opacity:.6"> {{ unit }}</span></div></div>
              {%- endmacro %}
              {% macro ring(label, pct, color) -%}
              <div style="display:flex;align-items:center;gap:12px"><div style="width:60px;height:60px;border-radius:50%;background:conic-gradient({{ color }} {{ pct }}%, rgba(255,255,255,.10) 0);display:flex;align-items:center;justify-content:center"><div style="width:46px;height:46px;border-radius:50%;background:var(--ha-card-background, var(--card-background-color));display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600">{{ pct|round(0)|int }}%</div></div><div style="font-size:12px;letter-spacing:.04em;text-transform:uppercase;opacity:.6">{{ label }}</div></div>
              {%- endmacro %}
              {% set p_today = states('predbat.cost_today')|float(0) / 100 %}{% set p_yest = states('predbat.cost_yesterday')|float(0) / 100 %}{% set p_sav = states('predbat.savings_yesterday_predbat')|float(0) / 100 %}
              {% set a_imp = state_attr('sensor.octopus_energy_electricity_19l3564787_2200019819270_previous_accumulative_cost', 'total_without_standing_charge')|float(states('sensor.octopus_energy_electricity_19l3564787_2200019819270_previous_accumulative_cost')|float(0)) %}{% set a_exp = state_attr('sensor.octopus_energy_electricity_19l3564787_2200044183701_export_previous_accumulative_cost', 'total_without_standing_charge')|float(states('sensor.octopus_energy_electricity_19l3564787_2200044183701_export_previous_accumulative_cost')|float(0)) %}{% set a_net = a_imp - a_exp %}{% set a_reset = state_attr('sensor.octopus_energy_electricity_19l3564787_2200019819270_previous_accumulative_cost', 'last_reset') %}
              <div style="padding:18px 20px;min-height:260px;box-sizing:border-box"><div style="font-size:12px;letter-spacing:.04em;text-transform:uppercase;opacity:.6;margin-bottom:16px">Energy cost</div>
              <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:16px 20px">{{ tile('Today so far (plan)', '£%.2f'|format(p_today|abs), 'earned' if p_today < 0 else '', '#42a5f5' if p_today >= 0 else '#66bb6a') }}{% set eod_key = (now().replace(hour=0, minute=0, second=0, microsecond=0) + timedelta(days=1)).strftime('%Y-%m-%dT%H:%M:%S%z') %}{% set eod_res = state_attr('predbat.best_metric', 'results') %}{% set eod_keys = (eod_res.keys() | select('le', eod_key) | list | sort) if eod_res is mapping else [] %}{% set eod = eod_res[eod_keys | last] / 100 if eod_keys | length > 0 else none %}{% if eod is not none %}{% set planned = eod - p_today %}<div>{{ tile('End of day (estimate)', '£%.2f'|format(eod|abs), 'earned' if eod < 0 else '', '#4db6ac' if eod >= 0 else '#66bb6a') }}<div style="padding:4px 0 0 15px;font-size:12px;opacity:.6">{{ ('−' if p_today < 0 else '') ~ '£%.2f'|format(p_today|abs) }} so far + {{ ('−' if planned < 0 else '') ~ '£%.2f'|format(planned|abs) }} planned</div></div>{% else %}{{ tile('End of day (estimate)', '—', 'plan not ready', '#9e9e9e') }}{% endif %}</div>{% set b_imp = states('predbat.cost_today_import')|float(0) / 100 %}{% set b_exp = states('predbat.cost_today_export')|float(0) / 100 %}{% set b_std = states('input_number.ep_cube_standing_charge')|float(0) %}<div style="margin-top:16px;padding-top:12px;border-top:1px solid rgba(255,255,255,.08);font-size:13px;opacity:.75">Imports {{ ('−' if b_imp < 0 else '') ~ '£%.2f'|format(b_imp|abs) }} + standing charge {{ ('−' if b_std < 0 else '') ~ '£%.2f'|format(b_std|abs) }} = <b>{{ ('−' if b_imp + b_std < 0 else '') ~ '£%.2f'|format(b_imp + b_std|abs) }}</b> (what the smart meter counts) · exports {{ ('−' if b_exp < 0 else '') ~ '£%.2f'|format(b_exp|abs) }} · net after standing charge <b>{{ ('−' if p_today + b_std < 0 else '') ~ '£%.2f'|format(p_today + b_std|abs) }}</b></div></div>
          - type: custom:html-template-card
            grid_options:
              columns: 18
            ignore_line_breaks: true
            content: |
              {% macro tile(label, value, unit, color) -%}
              <div style="border-left:3px solid {{ color }};padding:2px 0 2px 12px"><div style="font-size:12px;letter-spacing:.04em;text-transform:uppercase;opacity:.6">{{ label }}</div><div style="font-size:28px;font-weight:600;line-height:1.25">{{ value }}<span style="font-size:13px;font-weight:400;opacity:.6"> {{ unit }}</span></div></div>
              {%- endmacro %}
              {% macro ring(label, pct, color) -%}
              <div style="display:flex;align-items:center;gap:12px"><div style="width:60px;height:60px;border-radius:50%;background:conic-gradient({{ color }} {{ pct }}%, rgba(255,255,255,.10) 0);display:flex;align-items:center;justify-content:center"><div style="width:46px;height:46px;border-radius:50%;background:var(--ha-card-background, var(--card-background-color));display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600">{{ pct|round(0)|int }}%</div></div><div style="font-size:12px;letter-spacing:.04em;text-transform:uppercase;opacity:.6">{{ label }}</div></div>
              {%- endmacro %}
              {% set s = states('sensor.ep_cube_solar_today')|float(0) %}{% set i = states('sensor.ep_cube_grid_import_today')|float(0) %}{% set e = states('sensor.ep_cube_grid_export_today')|float(0) %}{% set l = states('sensor.ep_cube_backup_loads_today')|float(0) %}{% set sc = ([[((s - e) / s * 100) if s > 0 else 0, 0]|max, 100]|min) %}{% set cover = ([[((s - e) / l * 100) if l > 0 else 0, 0]|max, 100]|min) %}
              <div style="padding:18px 20px;min-height:260px;box-sizing:border-box"><div style="font-size:12px;letter-spacing:.04em;text-transform:uppercase;opacity:.6;margin-bottom:16px">Energy today</div>
              <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:16px 20px">{{ tile('Solar', '%.1f'|format(s), 'kWh', '#ffb300') }}{{ tile('Bought', '%.1f'|format(i), 'kWh', '#42a5f5') }}{{ tile('Sold', '%.1f'|format(e), 'kWh', '#ab47bc') }}{{ tile('Consumed', '%.1f'|format(l), 'kWh', '#eceff1') }}</div>
              <div style="display:flex;flex-wrap:wrap;gap:16px 32px;margin-top:20px;padding-top:16px;border-top:1px solid rgba(255,255,255,.08)">{{ ring('Solar used at home', sc, '#4db6ac') }}{{ ring('Solar covers consumption', cover, '#66bb6a') }}</div></div>

