      - type: grid
        column_span: 3
        cards:
          - type: custom:html-template-card
            grid_options:
              columns: 18
            ignore_line_breaks: true
            content: |
              {% macro tile(label, value, unit, color) -%}
              <div style="border-left:3px solid {{ color }};padding:2px 0 2px 12px"><div style="font-size:12px;letter-spacing:.04em;text-transform:uppercase;opacity:.6">{{ label }}</div><div style="font-size:28px;font-weight:600;line-height:1.25">{{ value }}<span style="font-size:13px;font-weight:400;opacity:.6"> {{ unit }}</span></div></div>
              {%- endmacro %}
              {% macro ring(label, pct, color) -%}
              <div style="display:flex;align-items:center;gap:12px"><div style="width:60px;height:60px;border-radius:50%;background:conic-gradient({{ color }} {{ pct }}%, rgba(255,255,255,.10) 0);display:flex;align-items:center;justify-content:center"><div style="width:46px;height:46px;border-radius:50%;background:var(--ha-card-background, var(--card-background-color));display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600">{{ pct|round(0)|int }}%</div></div><div style="font-size:12px;letter-spacing:.04em;text-transform:uppercase;opacity:.6">{{ label }}</div></div>
              {%- endmacro %}
              {% set p_yest = states('predbat.cost_yesterday')|float(0) / 100 %}{% set p_sav = states('predbat.savings_yesterday_predbat')|float(0) / 100 %}
              {% set a_imp = state_attr('sensor.octopus_energy_electricity_19l3564787_2200019819270_previous_accumulative_cost', 'total_without_standing_charge')|float(states('sensor.octopus_energy_electricity_19l3564787_2200019819270_previous_accumulative_cost')|float(0)) %}{% set a_exp = state_attr('sensor.octopus_energy_electricity_19l3564787_2200044183701_export_previous_accumulative_cost', 'total_without_standing_charge')|float(states('sensor.octopus_energy_electricity_19l3564787_2200044183701_export_previous_accumulative_cost')|float(0)) %}{% set a_net = a_imp - a_exp %}{% set a_reset = state_attr('sensor.octopus_energy_electricity_19l3564787_2200019819270_previous_accumulative_cost', 'last_reset') %}
              <div style="padding:18px 20px;min-height:260px;box-sizing:border-box"><div style="font-size:12px;letter-spacing:.04em;text-transform:uppercase;opacity:.6;margin-bottom:16px">Energy cost yesterday</div>
              <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:16px 20px">{% set a_day = as_timestamp(a_reset)|timestamp_custom('%d %b', true) if a_reset else '' %}{% set billed = a_day == (now() - timedelta(days=1)).strftime('%d %b') %}{% if billed %}{{ tile('Yesterday (billed energy)', '£%.2f'|format(a_net|abs), 'earned' if a_net < 0 else '', '#66bb6a' if a_net < 0 else '#ef5350') }}{{ tile('Predbat estimate', '£%.2f'|format(p_yest|abs), 'earned' if p_yest < 0 else '', '#4db6ac') }}{% else %}{{ tile('Yesterday (estimate)', '£%.2f'|format(p_yest|abs), 'earned' if p_yest < 0 else '', '#4db6ac' if p_yest >= 0 else '#66bb6a') }}{% endif %}{{ tile('Battery saving (plan)', ('-' if p_sav < 0 else '') ~ '£%.2f'|format(p_sav|abs), '', '#66bb6a' if p_sav >= 0 else '#ef5350') }}</div>{% if not billed %}<div style="margin-top:14px;font-size:13px;opacity:.6">Octopus publishes yesterday's billed figure around 19:50 this evening. Predbat's estimate (actual flows at the actual half-hourly rates) has been within about 10p of the bill each day.</div>{% endif %}</div>
          - type: custom:html-template-card
            grid_options:
              columns: 18
            ignore_line_breaks: true
            content: |
              {% macro tile(label, value, unit, color) -%}
              <div style="border-left:3px solid {{ color }};padding:2px 0 2px 12px"><div style="font-size:12px;letter-spacing:.04em;text-transform:uppercase;opacity:.6">{{ label }}</div><div style="font-size:28px;font-weight:600;line-height:1.25">{{ value }}<span style="font-size:13px;font-weight:400;opacity:.6"> {{ unit }}</span></div></div>
              {%- endmacro %}
              {% macro ring(label, pct, color) -%}
              <div style="display:flex;align-items:center;gap:12px"><div style="width:60px;height:60px;border-radius:50%;background:conic-gradient({{ color }} {{ pct }}%, rgba(255,255,255,.10) 0);display:flex;align-items:center;justify-content:center"><div style="width:46px;height:46px;border-radius:50%;background:var(--ha-card-background, var(--card-background-color));display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600">{{ pct|round(0)|int }}%</div></div><div style="font-size:12px;letter-spacing:.04em;text-transform:uppercase;opacity:.6">{{ label }}</div></div>
              {%- endmacro %}
              {% set s = states('sensor.ep_cube_solar_yesterday')|float(0) %}{% set i = states('sensor.ep_cube_grid_import_yesterday')|float(0) %}{% set e = states('sensor.ep_cube_grid_export_yesterday')|float(0) %}{% set l = states('sensor.ep_cube_backup_loads_yesterday')|float(0) %}{% set sc = ([[((s - e) / s * 100) if s > 0 else 0, 0]|max, 100]|min) %}{% set cover = ([[((s - e) / l * 100) if l > 0 else 0, 0]|max, 100]|min) %}
              <div style="padding:18px 20px;min-height:260px;box-sizing:border-box"><div style="font-size:12px;letter-spacing:.04em;text-transform:uppercase;opacity:.6;margin-bottom:16px">Energy yesterday</div>
              <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:16px 20px">{{ tile('Solar', '%.1f'|format(s), 'kWh', '#ffb300') }}{{ tile('Bought', '%.1f'|format(i), 'kWh', '#42a5f5') }}{{ tile('Sold', '%.1f'|format(e), 'kWh', '#ab47bc') }}{{ tile('Consumed', '%.1f'|format(l), 'kWh', '#eceff1') }}</div>
              <div style="display:flex;flex-wrap:wrap;gap:16px 32px;margin-top:20px;padding-top:16px;border-top:1px solid rgba(255,255,255,.08)">{{ ring('Solar used at home', sc, '#4db6ac') }}{{ ring('Solar covers consumption', cover, '#66bb6a') }}</div></div>

  - title: Week
    path: week
    icon: mdi:calendar-week
    type: sections
    max_columns: 3
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: custom:tabbed-card
            grid_options:
              columns: full
            tabs:
              - attributes:
                  label: Power
                card:
                  type: custom:apexcharts-card
                  grid_options:
                    columns: full
                  header:
                    show: true
                    title: "Power · last 7 days"
                    show_states: false
                  card_mod:
                    style: |
                      #header__title span { font-size: 12px; font-weight: 400; letter-spacing: .04em; text-transform: uppercase; opacity: .6; color: var(--primary-text-color); }
                  now:
                    show: false
                    label: ''
                  graph_span: 7d
                  span:
                    start: day
                    offset: -6d
                  apex_config:
                    chart:
                      height: 300
                      toolbar:
                        show: false
                      dropShadow:
                        enabled: true
                        enabledOnSeries: [10]
                        color: '#ffffff'
                        blur: 6
                        opacity: 0.9
                        top: 0
                        left: 0
                      animations:
                        enabled: false
                      zoom:
                        enabled: false
                    fill:
                      type: [solid, solid, gradient, gradient, gradient, solid, solid, solid, solid, solid]
                      opacity: [0.14, 0.14, 1, 1, 1, 1, 1, 1, 1, 1]
                      gradient:
                        shade: dark
                        type: vertical
                        opacityFrom: 0.5
                        opacityTo: 0.04
                        stops: [0, 100]
                    grid:
                      borderColor: '#ffffff17'
                    xaxis:
                      axisBorder:
                        show: false
                      axisTicks:
                        show: false
                      tooltip:
                        enabled: false
                    legend:
                      position: bottom
                      fontSize: '13px'
                      markers:
                        width: 11
                        height: 11
                        radius: 11
                      itemMargin:
                        horizontal: 10
                    tooltip:
                      theme: dark
                    dataLabels:
                      enabled: false
                  yaxis:
                    - id: kw
                      min: -8
                      max: 8
                      decimals: 0
                      apex_config:
                        tickAmount: 4
                        title:
                          text: kW
                    - id: win
                      show: false
                      min: 0
                      max: 1
                  series:
                    - entity: predbat.best_charge_limit
                      name: Charge window
                      type: area
                      curve: stepline
                      yaxis_id: win
                      color: '#43a047'
                      stroke_width: 0
                      opacity: 0.14
                      show:
                        legend_value: false
                      data_generator: |
                        const r = entity.attributes.results || {};
                        return Object.keys(r).sort().map(k => [new Date(k.replace(/([+-]\d\d)(\d\d)$/, '$1:$2')).getTime(), Number(r[k]) > 0 ? 1 : 0]);
                    - entity: predbat.best_export_limit
                      name: Export window
                      type: area
                      curve: stepline
                      yaxis_id: win
                      color: '#fb8c00'
                      stroke_width: 0
                      opacity: 0.14
                      show:
                        legend_value: false
                      data_generator: |
                        const r = entity.attributes.results || {};
                        return Object.keys(r).sort().map(k => [new Date(k.replace(/([+-]\d\d)(\d\d)$/, '$1:$2')).getTime(), Number(r[k]) < 100 ? 1 : 0]);
                    - entity: sensor.ep_cube_grid_power
                      name: Bought
                      type: area
                      curve: smooth
                      yaxis_id: kw
                      color: '#42a5f5'
                      stroke_width: 1.5
                      extend_to: now
                      transform: "return x > 0 ? x / 1000 : 0;"
                      unit: kW
                      show:
                        legend_value: false
                    - entity: sensor.ep_cube_grid_power
                      name: Sold
                      type: area
                      curve: smooth
                      yaxis_id: kw
                      color: '#ab47bc'
                      stroke_width: 1.5
                      extend_to: now
                      transform: "return x < 0 ? x / 1000 : 0;"
                      unit: kW
                      show:
                        legend_value: false
                    - entity: sensor.ep_cube_solar_power
                      name: Solar
                      type: area
                      curve: smooth
                      yaxis_id: kw
                      color: '#ffb300'
                      stroke_width: 1.5
                      extend_to: now
                      transform: "return x / 1000;"
                      unit: kW
                      show:
                        legend_value: false
                    - entity: sensor.ep_cube_load_power
                      name: Load
                      type: line
                      curve: smooth
                      yaxis_id: kw
                      color: '#eceff1'
                      stroke_width: 1.5
                      extend_to: now
                      transform: "return x / 1000;"
                      unit: kW
                      show:
                        legend_value: false
                    - entity: predbat.grid_power_best
                      name: Bought (forecast)
                      unit: kW
                      type: line
                      curve: stepline
                      yaxis_id: kw
                      color: '#42a5f5'
                      stroke_width: 1.5
                      stroke_dash: 2
                      show:
                        legend_value: false
                        in_legend: false
                      data_generator: |
                        const r = entity.attributes.results || {};
                        const tn = Date.now();
                        const a = Number((hass.states['sensor.ep_cube_grid_power'] || {state: 0}).state) / 1000 || 0;
                        const head = [[tn, Math.min(Math.max(a, 0), 7.27)]];
                        return head.concat(Object.keys(r).sort().map(k => [new Date(k.replace(/([+-]\d\d)(\d\d)$/, '$1:$2')).getTime(), Math.min(Math.max(Number(r[k]), 0), 7.27)]).filter(p => p[0] > tn));
                    - entity: predbat.grid_power_best
                      name: Sold (forecast)
                      unit: kW
                      type: line
                      curve: stepline
                      yaxis_id: kw
                      color: '#ab47bc'
                      stroke_width: 1.5
                      stroke_dash: 2
                      show:
                        legend_value: false
                        in_legend: false
                      data_generator: |
                        const r = entity.attributes.results || {};
                        const tn = Date.now();
                        const a = Number((hass.states['sensor.ep_cube_grid_power'] || {state: 0}).state) / 1000 || 0;
                        const head = [[tn, Math.min(a, 0)]];
                        return head.concat(Object.keys(r).sort().map(k => [new Date(k.replace(/([+-]\d\d)(\d\d)$/, '$1:$2')).getTime(), Math.min(Number(r[k]), 0)]).filter(p => p[0] > tn));
                    - entity: predbat.pv_power_best
