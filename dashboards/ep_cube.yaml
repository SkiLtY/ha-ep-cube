# EP Cube dashboard
#
# Drop-in Lovelace YAML for the Canadian Solar EP Cube. Three views:
#
#   - Now     — live power flow, instant SC / SS / grid-flow gauges,
#               battery status (what's the house doing right now)
#   - Today   — today + yesterday energy rollups (mirrors HA's own
#               Energy tab pattern)
#   - Control — operating-mode picker + mode-specific controls
#               (the "header switch" that swaps the active settings card)
#
# Install
# -------
# 1. Install power-flow-card-plus via HACS:
#      HACS → Frontend → "Power Flow Card Plus" by flixlix → Install
#      then restart HA so the new resource is picked up.
# 2. Settings → Dashboards → Add Dashboard → From YAML.
#    Title: "EP Cube"  Icon: mdi:home-battery
# 3. Edit the new dashboard → "Raw configuration editor" (top-right
#    three-dot menu) → paste the contents of this file → Save.
#
# Assumed entity IDs
# ------------------
# This file references the default IDs the EP Cube integration creates
# on a fresh install (device name "EP Cube"). If you renamed the device
# or have multiple cubes, edit the IDs to suit (HA will auto-append
# `_2`, `_3`, ... to disambiguate).
#
#   sensor.ep_cube_battery_soc            sensor.ep_cube_battery_power
#   sensor.ep_cube_battery_energy         sensor.ep_cube_grid_power
#   sensor.ep_cube_battery_capacity       sensor.ep_cube_solar_power
#   sensor.ep_cube_reserve_soc            sensor.ep_cube_load_power
#   sensor.ep_cube_operating_mode
#   select.ep_cube_operating_mode
#   number.ep_cube_self_consumption_reserve
#   number.ep_cube_backup_reserve
#   switch.ep_cube_allow_charging_from_grid
#   switch.ep_cube_daylight_saving_time
#
# Note: HA derives entity-ID slugs from each entity's **display name**, not
# the integration's internal translation_key — so e.g. the sensor with
# translation_key=battery_soc_kwh ships as `sensor.ep_cube_battery_energy`
# (display name "Battery energy"). The IDs above are what a fresh install
# produces; if you renamed any of them HA will preserve your override.

title: EP Cube
views:
  - title: Now
    path: now
    icon: mdi:flash
    cards:
      # ───────────────────────────────────────────────────────────────
      # Right now — live power gauges
      # Three gauges, all in W, that mirror the power-flow card below
      # in numeric form: Solar (always positive, capped at array
      # ceiling), Battery (signed, centered needle: charging right /
      # discharging left), Grid (signed, centered needle: importing
      # right / exporting left). Raw `*_power` sensors are wired
      # directly — no dead-band wrappers — because the jitter IS the
      # live feedback. Drop the dampened `_right_now` sensors if you
      # want a smoother read; they're still computed by the integration.
      #
      # Colour conventions:
      #   Solar    — all green (renewable generation)
      #   Battery  — blue when discharging (<0), green when charging (>0)
      #              Note: our DeviceStatus reports positive=charging /
      #              negative=discharging (see api.py); the gauge
      #              inherits that convention directly.
      #   Grid     — uncoloured (no universal good/bad mapping)
      # ───────────────────────────────────────────────────────────────
      - type: horizontal-stack
        cards:
          - type: gauge
            entity: sensor.ep_cube_solar_power
            name: Solar
            # 6.51 kWp array ceiling; edit if your install differs.
            min: 0
            max: 6500
            unit: W
            needle: true
            segments:
              - from: 0
                color: green
          - type: gauge
            entity: sensor.ep_cube_battery_power
            name: Battery
            # Observed cube max charge/discharge rate ~5.5 kW; matches
            # the BMS taper observations from session 29.
            min: -5500
            max: 5500
            unit: W
            needle: true
            segments:
              - from: -5500
                color: blue
              - from: 0
                color: green
          - type: gauge
            entity: sensor.ep_cube_grid_power
            name: Grid
            # Range matches power-flow-card-plus's max_expected_power
            # below (6.51 kWp array ceiling). Edit if your install
            # has a different inverter ceiling.
            min: -6500
            max: 6500
            unit: W
            needle: true
            # 7-stop gradient on each side, symmetric around 0.
            # Colour palette mirrors HA's Energy Dashboard convention:
            #   purple = energy returned to grid (export)
            #   blue   = energy consumed from grid (import)
            # Both are neutral state indicators (no good/bad framing) —
            # the gradient depth conveys magnitude. Light near 0,
            # deepens toward each extreme. HA's gauge segments are
            # discrete bands, not a true gradient — but 7 closely-
            # spaced stops read smoothly at a glance.
            segments:
              - from: -6500
                color: '#4A148C'
              - from: -6000
                color: '#6A1B9A'
              - from: -5000
                color: '#7B1FA2'
              - from: -4000
                color: '#9C27B0'
              - from: -3000
                color: '#AB47BC'
              - from: -2000
                color: '#BA68C8'
              - from: -1000
                color: '#CE93D8'
              - from: 0
                color: '#BBDEFB'
              - from: 1000
                color: '#90CAF9'
              - from: 2000
                color: '#64B5F6'
              - from: 3000
                color: '#42A5F5'
              - from: 4000
                color: '#2196F3'
              - from: 5000
                color: '#1976D2'
              - from: 6000
                color: '#0D47A1'

      # ───────────────────────────────────────────────────────────────
      # Live power flow
      # ───────────────────────────────────────────────────────────────
      - type: custom:power-flow-card-plus
        title: Energy Flow
        clickable_entities: true
        display_zero_lines:
          mode: show
          transparency: 50
          grey_color:
            - 189
            - 189
            - 189
        use_new_flow_rate_model: true
        # Precision options use the card's `base_decimals` / `kilo_decimals`
        # / `kilo_threshold` keys (NOT the w_decimals / kw_decimals /
        # watt_threshold names that show up in older community examples —
        # those are silently ignored and the card falls back to 1dp for
        # kW). The two-dp kW format matches the EP Cube app's display.
        base_decimals: 0       # watts: "810 W"
        kilo_decimals: 2       # kilowatts: "2.36 kW"
        kilo_threshold: 1000   # switch to kW above 1 kW
        min_flow_rate: 0.75
        max_flow_rate: 6
        max_expected_power: 6500   # 6.51 kWp array — clamps line speed at full output
        min_expected_power: 0.01
        transparency_zero_lines: 0
        entities:
          battery:
            entity: sensor.ep_cube_battery_power
            state_of_charge: sensor.ep_cube_battery_soc
            # The card's NATIVE convention (without invert) is
            # negative=charging / positive=discharging — verified in
            # power-flow-card-plus.js where toBattery = |min(value,0)|
            # and fromBattery = max(value,0). Our integration uses the
            # opposite (positive=charging, negative=discharging — see
            # api.py DeviceStatus.battery_power_w), so we MUST invert
            # the state for the card. Without this the flow dots
            # animate Solar→Battery during discharge and Battery is
            # mislabelled (↓ shown for charging instead of discharging).
            invert_state: true
            name: Battery
            icon: mdi:battery
            display_state: two_way
            color_circle: true
          grid:
            entity: sensor.ep_cube_grid_power
            name: Grid
            icon: mdi:transmission-tower
            color_circle: true
          solar:
            entity: sensor.ep_cube_solar_power
            name: Solar
            icon: mdi:solar-power
            color_value: true
            color_icon: true
            display_zero_state: true
          home:
            entity: sensor.ep_cube_load_power
            # Without override_state the card derives home consumption
            # from energy balance (solar + battery_out + grid_in -
            # battery_in - grid_out) and uses `entity` only for the
            # click-through "More info" dialog. Its derivation clamped
            # to 0 on the EP Cube on first live render even though the
            # entity itself read ~800 W (verified 2026-05-22 via
            # Developer Tools → States). Bypass the derivation and use
            # the integration's `load_power_w` directly — it's already
            # backUpPower + nonBackUpPower from the cube, which is what
            # the EP Cube mobile app shows as "Load".
            override_state: true
            name: Home
            icon: mdi:home
            color_icon: true

      # ───────────────────────────────────────────────────────────────
      # Battery status
      # ───────────────────────────────────────────────────────────────
      - type: entities
        title: Battery
        show_header_toggle: false
        entities:
          - entity: sensor.ep_cube_battery_soc
            name: State of charge
          - entity: sensor.ep_cube_battery_energy
            name: Energy stored
          - entity: sensor.ep_cube_battery_capacity
            name: Usable capacity
          - entity: sensor.ep_cube_reserve_soc
            name: Active reserve

  - title: Today
    path: today
    icon: mdi:calendar-today
    cards:
      # ───────────────────────────────────────────────────────────────
      # Daily energy (Phase 4.2 stats sensors)
      # ───────────────────────────────────────────────────────────────
      # Sourced from queryDataElectricityV2, refreshed every 5 min. Grid
      # import vs export are direction-split at the cube — what previously
      # surfaced as the single direction-ambiguous `grid_today` sensor
      # (deleted in v1.1.0) now lives here as two clean counters that wire
      # straight into HA's Energy Dashboard.
      # Entity IDs are slugified from the *display name* (after translation),
      # not the description's `key=`. So translation "Backup loads today" →
      # `sensor.ep_cube_backup_loads_today`, NOT `_backup_today`. Same trap
      # tripped session 17 with `power-flow-card-plus`.
      - type: entities
        title: Energy today
        show_header_toggle: false
        entities:
          - entity: sensor.ep_cube_solar_today
            name: Solar
          - entity: sensor.ep_cube_grid_import_today
            name: Grid import
          - entity: sensor.ep_cube_grid_export_today
            name: Grid export
          # `backup_loads_today` meters kWh delivered through the cube's
          # backup-output AC terminal, NOT "loads that stayed up during an
          # outage". If your installer wired the whole house behind the
          # backup panel (common in the UK) this reads as total household
          # consumption — feel free to rename `Backed loads` → `Total
          # consumption` / `House load`. If only essential circuits are
          # behind the backup output (typical contractor install), this is
          # just those circuits. See README's "Sensors" NOTE for the full
          # backup-loads / EPS Gateway semantics.
          - entity: sensor.ep_cube_backup_loads_today
            name: Backed loads
          - entity: sensor.ep_cube_self_consumption_today
            name: Self-consumption
          - entity: sensor.ep_cube_self_sufficiency_today
            name: Self-sufficiency

      - type: entities
        title: Energy yesterday
        show_header_toggle: false
        entities:
          - entity: sensor.ep_cube_solar_yesterday
            name: Solar
          - entity: sensor.ep_cube_grid_import_yesterday
            name: Grid import
          - entity: sensor.ep_cube_grid_export_yesterday
            name: Grid export
          - entity: sensor.ep_cube_backup_loads_yesterday
            name: Backed loads
          - entity: sensor.ep_cube_self_consumption_yesterday
            name: Self-consumption
          - entity: sensor.ep_cube_self_sufficiency_yesterday
            name: Self-sufficiency

  - title: Control
    path: control
    icon: mdi:cog
    cards:
      # ───────────────────────────────────────────────────────────────
      # Operating-mode picker + mode-specific controls
      # ───────────────────────────────────────────────────────────────
      # Wrapped in a vertical-stack so HA's masonry treats them as a
      # single unit. Without this, at wider window widths the masonry
      # pushes the conditional settings card into its own column instead
      # of sitting it directly below "Operating mode" — the active
      # settings card now always lives immediately under the picker
      # regardless of viewport.
      #
      # Conditional state values are the select's raw option keys
      # (self_consumption / time_of_use / backup), not the localized
      # display strings — `select` entities expose the key, not the label.
      - type: vertical-stack
        cards:
          - type: entities
            title: Operating mode
            show_header_toggle: false
            entities:
              - entity: select.ep_cube_operating_mode
                name: Mode

          # ───────── Self-consumption mode ─────────
          - type: conditional
            conditions:
              - entity: select.ep_cube_operating_mode
                state: self_consumption
            card:
              type: entities
              title: Self-consumption settings
              show_header_toggle: false
              entities:
                - entity: number.ep_cube_self_consumption_reserve
                  name: Reserve SoC

          # ───────── Backup mode ─────────
          - type: conditional
            conditions:
              - entity: select.ep_cube_operating_mode
                state: backup
            card:
              type: entities
              title: Backup settings
              show_header_toggle: false
              entities:
                - entity: number.ep_cube_backup_reserve
                  name: Reserve SoC

          # ───────── Time-of-use mode ─────────
          # TOU shares the self-consumption reserve as its outside-window
          # fallback (see api.py::_reserve_for_mode). Cube acceptance of
          # that write in TOU mode is provisional — the number entity is
          # permissively available in TOU; if the cube rejects it the
          # WriteVerificationError will surface in the HA log.
          #
          # No in-dashboard TOU schedule editor: from v1.0 the integration
          # is opinionated about Predbat being the single source of truth
          # for TOU. Use the EP Cube mobile app (or Bobsilvio's
          # `bobsilvio/epcube` HACS integration) if you need manual TOU.
          - type: conditional
            conditions:
              - entity: select.ep_cube_operating_mode
                state: time_of_use
            card:
              type: entities
              title: Time-of-use settings
              show_header_toggle: false
              entities:
                - entity: number.ep_cube_self_consumption_reserve
                  name: Reserve SoC
                - entity: switch.ep_cube_allow_charging_from_grid
                  name: Allow charging from grid
                - entity: switch.ep_cube_daylight_saving_time
                  name: Daylight saving time
