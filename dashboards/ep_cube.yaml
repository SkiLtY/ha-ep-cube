# EP Cube dashboard
#
# Drop-in Lovelace YAML for the Canadian Solar EP Cube. Views:
#
#   - Now       — a "right now" headline (what the cube is doing, battery
#                 full by, next charge / export, live price) with a plan
#                 strip for the day, the live power-flow card and a
#                 +-2 h power chart with Predbat's forecast dotted
#   - Today     — Power / Battery / Prices charts (tabs) plus energy-cost
#                 and energy cards for the day
#   - Yesterday — the same charts and cards for the previous day
#   - Week      — the last 7 days; week-to-date energy and cost cards
#                 need packages/ep_cube_weekly.yaml (see examples/)
#   - Month     — month-to-date energy and cost, and Octopus's billed cost
#                 for each week of the calendar month (bought, sold and net,
#                 with and without the standing charge); same package
#   - Control   — operating-mode picker + mode-specific controls
#               (the "header switch" that swaps the active settings card)
#
# Install
# -------
# 1. Install these via HACS (Frontend), then reload the browser:
#      - Power Flow Card Plus (flixlix)
#      - ApexCharts Card (RomRider)
#      - Tabbed Card
#      - Lovelace Card-mod (thomasloven)
#      - HTML Jinja2 Template card
#    The chart and tile cards also assume the Octopus Energy integration
#    (rate and cost sensors) and Predbat (plan entities); edit the
#    entity IDs below to suit your meters.
# 2. Settings → Dashboards → Add Dashboard → From YAML.
#    Title: "EP Cube"  Icon: mdi:home-battery
# 3. Edit the new dashboard → "Raw configuration editor" (top-right
#    three-dot menu) → paste the contents of this file → Save.
#
# Assumed entity IDs
# ------------------
# This file references the default IDs the EP Cube integration creates
# on a fresh install (device name "EP Cube"). If you renamed the device
# or have multiple cubes, edit the IDs to suit (HA will auto-append
# `_2`, `_3`, ... to disambiguate).
#
#   sensor.ep_cube_battery_soc            sensor.ep_cube_battery_power
#   sensor.ep_cube_battery_energy         sensor.ep_cube_grid_power
#   sensor.ep_cube_battery_capacity       sensor.ep_cube_solar_power
#   sensor.ep_cube_reserve_soc            sensor.ep_cube_load_power
#   sensor.ep_cube_operating_mode
#   select.ep_cube_operating_mode
#   number.ep_cube_self_consumption_reserve
#   number.ep_cube_backup_reserve
#   switch.ep_cube_allow_charging_from_grid
#   switch.ep_cube_daylight_saving_time
#
# The "Now" view's at-a-glance card also reads your BottlecapDave Octopus
# Energy import/export current-rate sensors directly (MPAN/serial baked
# into the entity ID, so these WILL differ per account — edit to match
# yours, e.g. via Developer Tools → States, filter "current_rate"):
#
#   sensor.octopus_energy_electricity_<serial>_<import_mpan>_current_rate
#   sensor.octopus_energy_electricity_<serial>_<export_mpan>_export_current_rate
#
# The "Today" view's "Cost — plan vs actual" card additionally reads:
#   - predbat.cost_today_import / cost_today_export / cost_yesterday /
#     savings_yesterday_predbat — Predbat's own plan, in PENCE. These are
#     written directly via the HA state API (not through a proper
#     integration platform) so they never appear in the entity registry
#     or an entity picker — Developer Tools → States, filter "predbat",
#     is the only way to browse them.
#   - sensor.octopus_energy_electricity_<serial>_<import_mpan>_previous_accumulative_cost
#     sensor.octopus_energy_electricity_<serial>_<export_mpan>_export_previous_accumulative_cost
#     — the actual bill (real consumption × real settled rate), in POUNDS.
#     Lags 1-2 days behind today, so it won't usually be the same day as
#     Predbat's "yesterday" — the card labels which date the actual
#     figure covers.
#
# Note: HA derives entity-ID slugs from each entity's **display name**, not
# the integration's internal translation_key — so e.g. the sensor with
# translation_key=battery_soc_kwh ships as `sensor.ep_cube_battery_energy`
# (display name "Battery energy"). The IDs above are what a fresh install
# produces; if you renamed any of them HA will preserve your override.

title: EP Cube
views:
  - title: Now
    path: now
    icon: mdi:flash
    type: sections
    max_columns: 3
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: custom:html-template-card
            grid_options:
              columns: full
            ignore_line_breaks: true
            content: |
              {% macro tile(label, value, unit, color) -%}
              <div style="border-left:3px solid {{ color }};padding:2px 0 2px 12px"><div style="font-size:12px;letter-spacing:.04em;text-transform:uppercase;opacity:.6">{{ label }}</div><div style="font-size:28px;font-weight:600;line-height:1.25">{{ value }}<span style="font-size:13px;font-weight:400;opacity:.6"> {{ unit }}</span></div></div>
              {%- endmacro %}
              {% macro ring(label, pct, color) -%}
              <div style="display:flex;align-items:center;gap:12px"><div style="width:60px;height:60px;border-radius:50%;background:conic-gradient({{ color }} {{ pct }}%, rgba(255,255,255,.10) 0);display:flex;align-items:center;justify-content:center"><div style="width:46px;height:46px;border-radius:50%;background:var(--ha-card-background, var(--card-background-color));display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600">{{ pct|round(0)|int }}%</div></div><div style="font-size:12px;letter-spacing:.04em;text-transform:uppercase;opacity:.6">{{ label }}</div></div>
              {%- endmacro %}
              {% set bp = states('sensor.ep_cube_battery_power')|float(0) %}{% set gp = states('sensor.ep_cube_grid_power')|float(0) %}{% set sp = states('sensor.ep_cube_solar_power')|float(0) %}{% set lp = states('sensor.ep_cube_load_power')|float(0) %}{% set soc = states('sensor.ep_cube_battery_soc')|float(0) %}
              {% set hold = 'Freeze' in states('predbat.status') %}{% if gp > 300 and bp > 300 %}{% set title = 'Charging from the grid' %}{% set col = '#42a5f5' %}{% set big = bp %}{% elif gp < -300 %}{% set title = 'Selling to the grid' %}{% set col = '#ab47bc' %}{% set big = -gp %}{% elif bp > 300 %}{% set title = 'Charging from solar' %}{% set col = '#ffb300' %}{% set big = bp %}{% elif bp < -300 %}{% set title = 'Battery powering the home' %}{% set col = '#4db6ac' %}{% set big = -bp %}{% elif hold %}{% set title = 'Holding the battery at ' ~ (soc|round(0)|int) ~ '%' %}{% set col = '#90a4ae' %}{% set big = lp %}{% elif gp > 100 and sp > 100 %}{% set title = 'Solar and grid powering the home' %}{% set col = '#ffb300' %}{% set big = lp %}{% elif gp > 100 %}{% set title = 'Grid powering the home' %}{% set col = '#42a5f5' %}{% set big = gp %}{% elif sp > 300 %}{% set title = 'Solar powering the home' %}{% set col = '#ffb300' %}{% set big = sp %}{% else %}{% set title = 'Standing by' %}{% set col = '#9e9e9e' %}{% set big = lp %}{% endif %}
              {% set cap = state_attr('predbat.soc_kw_best', 'soc_max')|float(0) %}{% set curve = state_attr('predbat.soc_kw_best', 'results') or {} %}{% set ns = namespace(full=none) %}
              {% if soc < 98 and cap > 0 %}{% for k, v in curve|dictsort %}{% set t = strptime(k, '%Y-%m-%dT%H:%M:%S%z') %}{% if ns.full is none and t > now() and v|float(0) >= cap * 0.985 %}{% set ns.full = t %}{% endif %}{% endfor %}{% endif %}
              {% set cs = state_attr('predbat.best_charge_start', 'timestamp') %}{% set ce = state_attr('predbat.best_charge_end', 'timestamp') %}{% set es = state_attr('predbat.best_export_start', 'timestamp') %}{% set ee = state_attr('predbat.best_export_end', 'timestamp') %}
              {% set imp = states('sensor.octopus_energy_electricity_19l3564787_2200019819270_current_rate')|float(0) * 100 %}{% set exp = states('sensor.octopus_energy_electricity_19l3564787_2200044183701_export_current_rate')|float(0) * 100 %}
              <div style="padding:20px 24px;box-sizing:border-box">
              <div style="display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap">
              <div style="display:flex;align-items:center;gap:18px"><div style="width:14px;height:14px;border-radius:50%;background:{{ col }};box-shadow:0 0 14px {{ col }}"></div><div><div style="font-size:12px;letter-spacing:.04em;text-transform:uppercase;opacity:.6">Right now</div><div style="font-size:30px;font-weight:600;line-height:1.2">{{ title }}</div><div style="font-size:13px;opacity:.6;margin-top:2px">Home {{ '%.2f'|format(lp / 1000) }} kW · Solar {{ '%.2f'|format(sp / 1000) }} · Grid {{ '%.2f'|format(gp|abs / 1000) }} {{ 'import' if gp >= 0 else 'export' }} · Battery {{ '%.2f'|format(bp|abs / 1000) }} {{ 'charging' if bp > 0 else 'discharging' }}</div></div></div>
              <div style="display:flex;align-items:baseline;gap:6px"><span style="font-size:46px;font-weight:700;color:{{ col }}">{{ '%.1f'|format(big / 1000) }}</span><span style="font-size:18px;opacity:.6">kW</span></div>
              <div style="display:flex;align-items:center;gap:14px"><div style="width:72px;height:72px;border-radius:50%;background:conic-gradient(#4db6ac {{ soc|round(0)|int }}%, rgba(255,255,255,.10) 0);display:flex;align-items:center;justify-content:center"><div style="width:56px;height:56px;border-radius:50%;background:var(--ha-card-background, var(--card-background-color));display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700">{{ soc|round(0)|int }}%</div></div><div><div style="font-size:12px;letter-spacing:.04em;text-transform:uppercase;opacity:.6">Battery</div><div style="font-size:14px;margin-top:4px">{{ '%.1f'|format(states('sensor.ep_cube_battery_energy')|float(0)) }} of {{ '%.0f'|format(states('sensor.ep_cube_battery_capacity')|float(0)) }} kWh</div><div style="font-size:12px;opacity:.6">reserve {{ states('sensor.ep_cube_reserve_soc')|float(0)|round(0)|int }}%</div></div></div>
              </div>
              <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px 24px;margin-top:22px;padding-top:18px;border-top:1px solid rgba(255,255,255,.08)">
              {{ tile('Battery full' if ns.full else 'Battery', ('about ' ~ ns.full.strftime('%H:%M')) if ns.full else ('Full' if soc >= 98 else 'not filling'), '', '#4db6ac') }}
              {% if cs and ce and as_datetime(cs) <= now() <= as_datetime(ce) %}{{ tile('Charging until', as_datetime(ce).strftime('%H:%M'), '', '#43a047') }}{% elif cs and ce and as_datetime(cs) > now() %}{{ tile('Next charge', as_datetime(cs).strftime('%H:%M') ~ '–' ~ as_datetime(ce).strftime('%H:%M'), '', '#43a047') }}{% else %}{{ tile('Next charge', 'none planned', '', '#43a047') }}{% endif %}
              {% set elim = state_attr('predbat.best_export_limit', 'results') or {} %}{% set ehold = (elim[es]|float(100) >= 90) if (es and es in elim) else false %}{% if es and ee and as_datetime(es) <= now() <= as_datetime(ee) %}{{ tile('Holding until' if hold else 'Exporting until', as_datetime(ee).strftime('%H:%M'), '', '#90a4ae' if hold else '#fb8c00') }}{% elif es and ee and as_datetime(es) > now() %}{{ tile('Next hold' if ehold else 'Next export', as_datetime(es).strftime('%H:%M') ~ '–' ~ as_datetime(ee).strftime('%H:%M'), '', '#90a4ae' if ehold else '#fb8c00') }}{% else %}{{ tile('Next export', 'none planned', '', '#fb8c00') }}{% endif %}
              {{ tile('Price now', '%.1fp'|format(imp) ~ ' / %.1fp'|format(exp), 'in / out', '#eceff1') }}
              </div>
              {% set mid = today_at('00:00').timestamp() %}{% set rates = (state_attr('event.octopus_energy_electricity_19l3564787_2200019819270_current_day_rates', 'rates') or []) %}
              {% set nsc = namespace(h='', st=none) %}{% set nse = namespace(h='', st=none) %}
              {% for k, v in (state_attr('predbat.best_charge_limit', 'results') or {})|dictsort %}{% set t = strptime(k, '%Y-%m-%dT%H:%M:%S%z').timestamp() %}{% if v|float(0) > 0 and nsc.st is none %}{% set nsc.st = t %}{% elif v|float(0) <= 0 and nsc.st is not none %}{% set a = [((nsc.st - mid) / 864), 0]|max %}{% set b = [((t - mid) / 864), 100]|min %}{% if b > a %}{% set nsc.h = nsc.h ~ '<div style="position:absolute;left:' ~ a ~ '%;width:' ~ (b - a) ~ '%;top:0;height:16px;background:#43a047;border-radius:3px"></div>' %}{% endif %}{% set nsc.st = none %}{% endif %}{% endfor %}
              {% set nsh = namespace(h='') %}{% set cur = namespace(c='', st=none) %}{% for k, v in (state_attr('predbat.best_export_limit', 'results') or {})|dictsort %}{% set t = strptime(k, '%Y-%m-%dT%H:%M:%S%z').timestamp() %}{% set c = 'e' if v|float(100) < 90 else ('h' if v|float(100) < 100 else '') %}{% if c != cur.c %}{% if cur.c != '' %}{% set a = [((cur.st - mid) / 864), 0]|max %}{% set b = [((t - mid) / 864), 100]|min %}{% if b > a %}{% set seg = '<div style="position:absolute;left:' ~ a ~ '%;width:' ~ (b - a) ~ '%;top:0;height:16px;background:' ~ ('#fb8c00' if cur.c == 'e' else '#90a4ae') ~ ';border-radius:3px"></div>' %}{% if cur.c == 'e' %}{% set nse.h = nse.h ~ seg %}{% else %}{% set nsh.h = nsh.h ~ seg %}{% endif %}{% endif %}{% endif %}{% set cur.c = c %}{% set cur.st = t %}{% endif %}{% endfor %}{% if cur.c != '' %}{% set a = [((cur.st - mid) / 864), 0]|max %}{% set b = 100 %}{% if b > a %}{% set seg = '<div style="position:absolute;left:' ~ a ~ '%;width:' ~ (b - a) ~ '%;top:0;height:16px;background:' ~ ('#fb8c00' if cur.c == 'e' else '#90a4ae') ~ ';border-radius:3px"></div>' %}{% if cur.c == 'e' %}{% set nse.h = nse.h ~ seg %}{% else %}{% set nsh.h = nsh.h ~ seg %}{% endif %}{% endif %}{% endif %}
              {% if cs and ce %}{% set a = [((as_timestamp(cs) - mid) / 864), 0]|max %}{% set b = [((as_timestamp(ce) - mid) / 864), 100]|min %}{% if b > a %}{% set nsc.h = nsc.h ~ '<div style="position:absolute;left:' ~ a ~ '%;width:' ~ (b - a) ~ '%;top:0;height:16px;background:#43a047;border-radius:3px"></div>' %}{% endif %}{% endif %}
              {% if es and ee %}{% set a = [((as_timestamp(es) - mid) / 864), 0]|max %}{% set b = [((as_timestamp(ee) - mid) / 864), 100]|min %}{% if b > a %}{% set seg2 = '<div style="position:absolute;left:' ~ a ~ '%;width:' ~ (b - a) ~ '%;top:0;height:16px;background:' ~ ('#90a4ae' if ehold else '#fb8c00') ~ ';border-radius:3px"></div>' %}{% if ehold %}{% set nsh.h = nsh.h ~ seg2 %}{% else %}{% set nse.h = nse.h ~ seg2 %}{% endif %}{% endif %}{% endif %}
              {% set nsp = namespace(h='') %}{% for r in rates %}{% set a = (as_timestamp(r.start) - mid) / 864 %}{% set p = r.value_inc_vat * 100 %}{% set nsp.h = nsp.h ~ '<div style="position:absolute;left:' ~ a ~ '%;width:2.0833%;top:20px;height:12px;background:rgba(66,165,245,' ~ (0.12 + ([p, 40]|min / 40) * 0.75) ~ ')"></div>' %}{% endfor %}
              {% set nowp = (now().timestamp() - mid) / 864 %}
              <div style="margin-top:22px;padding-top:18px;border-top:1px solid rgba(255,255,255,.08)"><div style="font-size:12px;letter-spacing:.04em;text-transform:uppercase;opacity:.6;margin-bottom:10px">The plan today <span style="text-transform:none;opacity:.8">&nbsp; <span style="color:#43a047">&#9632;</span> charge &nbsp; <span style="color:#fb8c00">&#9632;</span> export &nbsp; <span style="color:#90a4ae">&#9632;</span> hold &nbsp; <span style="color:#42a5f5">&#9632;</span> import price (brighter = dearer)</span></div>
              <div style="position:relative;height:34px;border-radius:4px;background:rgba(255,255,255,.04);overflow:hidden">{{ nsp.h }}{{ nsc.h }}{{ nse.h }}{{ nsh.h }}<div style="position:absolute;left:0;top:0;bottom:0;width:{{ nowp }}%;background:rgba(18,18,18,.6)"></div><div style="position:absolute;left:{{ nowp }}%;top:-2px;bottom:-2px;width:2px;background:#fff;box-shadow:0 0 8px #fff"></div></div>
              <div style="position:relative;height:16px;margin-top:4px;font-size:11px;opacity:.55">{% for hh in [0, 3, 6, 9, 12, 15, 18, 21] %}<span style="position:absolute;left:{{ hh / 24 * 100 }}%">{{ '%02d'|format(hh) }}:00</span>{% endfor %}</div></div>
              </div>
      - type: grid
        cards:
          # ───────────────────────────────────────────────────────────────
          # Live power flow
          # ───────────────────────────────────────────────────────────────
          - type: custom:power-flow-card-plus
            title: Energy Flow
            clickable_entities: true
            display_zero_lines:
              mode: show
              transparency: 50
              grey_color:
                - 189
                - 189
                - 189
            use_new_flow_rate_model: true
            # Precision options use the card's `base_decimals` / `kilo_decimals`
            # / `kilo_threshold` keys (NOT the w_decimals / kw_decimals /
            # watt_threshold names that show up in older community examples —
            # those are silently ignored and the card falls back to 1dp for
            # kW). The two-dp kW format matches the EP Cube app's display.
            base_decimals: 0       # watts: "810 W"
            kilo_decimals: 2       # kilowatts: "2.36 kW"
            kilo_threshold: 0   # always kW
            min_flow_rate: 0.5
            max_flow_rate: 4
            max_expected_power: 7500   # 6.51 kWp array — clamps line speed at full output
            min_expected_power: 0.01
            transparency_zero_lines: 0
            card_mod:
              style:
                .: |
                  ha-card {
                    --energy-grid-consumption-color: #42a5f5;
                    --energy-grid-return-color: #ab47bc;
                    background: linear-gradient(160deg, rgba(255,255,255,.035), rgba(255,255,255,0) 60%), var(--ha-card-background, var(--card-background-color));
                  }
                  .circle-container.solar .circle { box-shadow: 0 0 8px rgba(255,179,0,.16); }
                  .circle-container.grid .circle { box-shadow: 0 0 8px rgba(66,165,245,.16); }
                  .circle-container.battery .circle { box-shadow: 0 0 8px rgba(77,182,172,.16); }
                  .circle-container.home .circle { box-shadow: 0 0 8px rgba(239,83,80,.16); }
                  .circle span { font-weight: 600; }
                  .circle-container.individual-top .circle, .circle-container.individual-bottom .circle { border-width: 4px !important; box-shadow: 0 0 8px rgba(255,112,67,.16); }
                  .circle-container.individual-top ha-icon, .circle-container.individual-bottom ha-icon { color: #ff7043 !important; }
                  .circle span ha-icon.small { display: none; }
                  .lines path.solar, .lines path.return, .lines path.battery-solar { stroke: #ffb300 !important; }
                  .lines circle.solar, .lines circle.return, .lines circle.battery-solar { fill: #ffb300 !important; stroke: #ffb300 !important; }
                  .lines path.grid, .lines path.battery-from-grid { stroke: #42a5f5 !important; }
                  .lines circle.grid, .lines circle.battery-from-grid { fill: #42a5f5 !important; stroke: #42a5f5 !important; }
                  .lines path.battery-home, .lines path.battery-to-grid { stroke: #4db6ac !important; }
                  .lines circle.battery-home, .lines circle.battery-to-grid { fill: #4db6ac !important; stroke: #4db6ac !important; }
                  .home-circle-sections { display: none; }
                  .circle-container.battery .circle {
                    border: none !important;
                    background: radial-gradient(closest-side, var(--ha-card-background, var(--card-background-color)) calc(100% - 4px), transparent calc(100% - 3px)), conic-gradient(#4db6ac {{ states('sensor.ep_cube_battery_soc')|float(0) }}%, rgba(255,255,255,.12) 0);
                  }
                  #battery-state-of-charge-text { display: none; }
                  .circle-container.battery ha-icon:not(.small) { color: #4db6ac !important; --icon-battery-color: #4db6ac; }
                  .circle-container.home .circle { border: 4px solid #ef5350; color: #ef5350 !important; }
                  .circle-container.home ha-icon { color: #ef5350 !important; }
                  .circle-container.solar .circle, .circle-container.grid .circle { border-width: 4px !important; }
                  .circle .secondary-info { font-weight: 500; opacity: .8; }
                  .label { font-size: 12px !important; letter-spacing: .04em; text-transform: uppercase; opacity: .65; }
                ha-card$: |
                  .card-header { font-size: 12px !important; font-weight: 400 !important; letter-spacing: .04em; text-transform: uppercase; opacity: .6; padding-bottom: 0 !important; }
            entities:
              battery:
                entity: sensor.ep_cube_battery_power
                state_of_charge: sensor.ep_cube_battery_soc
                # The card's NATIVE convention (without invert) is
                # negative=charging / positive=discharging — verified in
                # power-flow-card-plus.js where toBattery = |min(value,0)|
                # and fromBattery = max(value,0). Our integration uses the
                # opposite (positive=charging, negative=discharging — see
                # api.py DeviceStatus.battery_power_w), so we MUST invert
                # the state for the card. Without this the flow dots
                # animate Solar→Battery during discharge and Battery is
                # mislabelled (↓ shown for charging instead of discharging).
                invert_state: true
                name: Battery
                icon: mdi:battery
                display_state: one_way
                color:
                  consumption: '#4db6ac'
                  production: '#4db6ac'
                color_circle: true
              grid:
                entity: sensor.ep_cube_grid_power
                name: Grid
                color_icon: color_dynamically
                display_state: one_way
                color:
                  consumption: '#42a5f5'
                  production: '#ab47bc'
                icon: mdi:transmission-tower
                color_circle: true
              solar:
                entity: sensor.ep_cube_solar_power
                name: Solar
                icon: mdi:solar-power
                color_value: true
                color_icon: true
                display_zero_state: true
              home:
                entity: sensor.ep_cube_load_power
                # Without override_state the card derives home consumption
                # from energy balance (solar + battery_out + grid_in -
                # battery_in - grid_out) and uses `entity` only for the
                # click-through "More info" dialog. Its derivation clamped
                # to 0 on the EP Cube on first live render even though the
                # entity itself read ~800 W (verified 2026-05-22 via
                # Developer Tools → States). Bypass the derivation and use
                # the integration's `load_power_w` directly — it's already
                # backUpPower + nonBackUpPower from the cube, which is what
                # the EP Cube mobile app shows as "Load".
                override_state: true
                name: Home
                icon: mdi:home
                color_icon: true
                # Optional EV bubble, for cubes that report a charger (v1.5+). Add
                # examples/ha_config/packages/ep_cube_ev.yaml and restart, then uncomment
                # the next line and the `individual:` block below. Home then shows the
                # house on its own, with the car in a bubble of its own beside it.
                # subtract_individual: true
              # individual:
              #   - entity: sensor.ep_cube_ev_charger_power_kw
              #     name: EV
              #     icon: mdi:car-electric
              #     color: '#ff7043'
              #     color_icon: true
              #     color_value: true
              #     display_zero: true
      - type: grid
        column_span: 2
        cards:
          - type: custom:apexcharts-card
            grid_options:
              columns: full
            header:
              show: true
              title: "Power"
              show_states: false
            card_mod:
              style: |
