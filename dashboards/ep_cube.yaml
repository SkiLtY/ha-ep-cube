                      curve: stepline
                      yaxis_id: kw
                      color: '#ffb300'
                      stroke_width: 1.5
                      stroke_dash: 2
                      show:
                        legend_value: false
                        in_legend: false
                      data_generator: |
                        const r = entity.attributes.results || {};
                        const tn = Date.now();
                        const a = Number((hass.states['sensor.ep_cube_solar_power'] || {state: 0}).state) / 1000 || 0;
                        const head = [[tn, a]];
                        return head.concat(Object.keys(r).sort().map(k => [new Date(k.replace(/([+-]\d\d)(\d\d)$/, '$1:$2')).getTime(), Number(r[k])]).filter(p => p[0] > tn));
                    - entity: predbat.load_power_best
                      name: Load (forecast)
