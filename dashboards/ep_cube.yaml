                ignore_line_breaks: true
                content: |
                  {% macro tile(label, value, unit, color) -%}
                  <div style="border-left:3px solid {{ color }};padding:2px 0 2px 12px"><div style="font-size:12px;letter-spacing:.04em;text-transform:uppercase;opacity:.6">{{ label }}</div><div style="font-size:28px;font-weight:600;line-height:1.25">{{ value }}<span style="font-size:13px;font-weight:400;opacity:.6"> {{ unit }}</span></div></div>
                  {%- endmacro %}
                  {% macro ring(label, pct, color) -%}
                  <div style="display:flex;align-items:center;gap:12px"><div style="width:60px;height:60px;border-radius:50%;background:conic-gradient({{ color }} {{ pct }}%, rgba(255,255,255,.10) 0);display:flex;align-items:center;justify-content:center"><div style="width:46px;height:46px;border-radius:50%;background:var(--ha-card-background, var(--card-background-color));display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600">{{ pct|round(0)|int }}%</div></div><div style="font-size:12px;letter-spacing:.04em;text-transform:uppercase;opacity:.6">{{ label }}</div></div>
                  {%- endmacro %}
                  {% set c_in = states('sensor.ep_cube_week_billed_import')|float(0) %}{% set c_ex = states('sensor.ep_cube_week_billed_export')|float(0) %}{% set net = c_in - c_ex %}
                  <div style="padding:18px 20px;min-height:260px;box-sizing:border-box"><div style="font-size:12px;letter-spacing:.04em;text-transform:uppercase;opacity:.6;margin-bottom:16px">Energy cost week to date (billed)</div>
                  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px 20px">{{ tile('Bought', '£%.2f'|format(c_in), '', '#42a5f5') }}{{ tile('Sold', '£%.2f'|format(c_ex), 'earned', '#ab47bc') }}{{ tile('Net', '£%.2f'|format(net|abs), 'earned' if net < 0 else '', '#66bb6a') }}</div></div>
              - type: custom:html-template-card
                ignore_line_breaks: true
                content: |
                  {% macro tile(label, value, unit, color) -%}
                  <div style="border-left:3px solid {{ color }};padding:2px 0 2px 12px"><div style="font-size:12px;letter-spacing:.04em;text-transform:uppercase;opacity:.6">{{ label }}</div><div style="font-size:28px;font-weight:600;line-height:1.25">{{ value }}<span style="font-size:13px;font-weight:400;opacity:.6"> {{ unit }}</span></div></div>
                  {%- endmacro %}
                  {% macro ring(label, pct, color) -%}
                  <div style="display:flex;align-items:center;gap:12px"><div style="width:60px;height:60px;border-radius:50%;background:conic-gradient({{ color }} {{ pct }}%, rgba(255,255,255,.10) 0);display:flex;align-items:center;justify-content:center"><div style="width:46px;height:46px;border-radius:50%;background:var(--ha-card-background, var(--card-background-color));display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600">{{ pct|round(0)|int }}%</div></div><div style="font-size:12px;letter-spacing:.04em;text-transform:uppercase;opacity:.6">{{ label }}</div></div>
                  {%- endmacro %}
                  {% set s = states('sensor.ep_cube_week_solar')|float(0) %}{% set i = states('sensor.ep_cube_week_import')|float(0) %}{% set e = states('sensor.ep_cube_week_export')|float(0) %}{% set l = states('sensor.ep_cube_week_consumed')|float(0) %}{% set sc = ((s - e) / s * 100) if s > 0 else 0 %}{% set ss = ((l - i) / l * 100) if l > 0 else 0 %}
                  <div style="padding:18px 20px;min-height:260px;box-sizing:border-box"><div style="font-size:12px;letter-spacing:.04em;text-transform:uppercase;opacity:.6;margin-bottom:16px">Energy week to date</div>
                  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px 20px">{{ tile('Solar', '%.1f'|format(s), 'kWh', '#ffb300') }}{{ tile('Bought', '%.1f'|format(i), 'kWh', '#42a5f5') }}{{ tile('Sold', '%.1f'|format(e), 'kWh', '#ab47bc') }}{{ tile('Consumed', '%.1f'|format(l), 'kWh', '#eceff1') }}</div>
                  <div style="display:flex;flex-wrap:wrap;gap:16px 32px;margin-top:20px;padding-top:16px;border-top:1px solid rgba(255,255,255,.08)">{{ ring('Self-consumption', sc, '#4db6ac') }}{{ ring('Self-sufficiency', ss, '#66bb6a') }}</div></div>

  - title: Control
    path: control
    icon: mdi:cog
    cards:
      # ───────────────────────────────────────────────────────────────
      # Operating-mode picker + mode-specific controls
      # ───────────────────────────────────────────────────────────────
      # Wrapped in a vertical-stack so HA's masonry treats them as a
      # single unit. Without this, at wider window widths the masonry
      # pushes the conditional settings card into its own column instead
      # of sitting it directly below "Operating mode" — the active
      # settings card now always lives immediately under the picker
      # regardless of viewport.
      #
      # Conditional state values are the select's raw option keys
      # (self_consumption / time_of_use / backup), not the localized
      # display strings — `select` entities expose the key, not the label.
      - type: vertical-stack
        cards:
          - type: entities
            title: Operating mode
            show_header_toggle: false
            entities:
              - entity: select.ep_cube_operating_mode
                name: Mode

          # ───────── Self-consumption mode ─────────
          - type: conditional
            conditions:
              - entity: select.ep_cube_operating_mode
                state: self_consumption
            card:
              type: entities
              title: Self-consumption settings
              show_header_toggle: false
              entities:
                - entity: number.ep_cube_self_consumption_reserve
                  name: Reserve SoC

          # ───────── Backup mode ─────────
          - type: conditional
            conditions:
              - entity: select.ep_cube_operating_mode
                state: backup
            card:
              type: entities
              title: Backup settings
              show_header_toggle: false
              entities:
                - entity: number.ep_cube_backup_reserve
                  name: Reserve SoC

          # ───────── Time-of-use mode ─────────
          # TOU shares the self-consumption reserve as its outside-window
          # fallback (see api.py::_reserve_for_mode). Cube acceptance of
          # that write in TOU mode is provisional — the number entity is
          # permissively available in TOU; if the cube rejects it the
          # WriteVerificationError will surface in the HA log.
          #
          # No in-dashboard TOU schedule editor: from v1.0 the integration
          # is opinionated about Predbat being the single source of truth
          # for TOU. Use the EP Cube mobile app (or Bobsilvio's
          # `bobsilvio/epcube` HACS integration) if you need manual TOU.
          - type: conditional
            conditions:
              - entity: select.ep_cube_operating_mode
                state: time_of_use
            card:
              type: entities
              title: Time-of-use settings
              show_header_toggle: false
              entities:
                - entity: number.ep_cube_self_consumption_reserve
                  name: Reserve SoC
                - entity: switch.ep_cube_allow_charging_from_grid
                  name: Allow charging from grid
                - entity: switch.ep_cube_daylight_saving_time
                  name: Daylight saving time
