                  seriesName: Standing charge
              - id: c3
                show: false
                apex_config:
                  seriesName: Standing charge
              - id: c4
                show: false
                apex_config:
                  seriesName: Standing charge
              - id: c5
                show: false
                apex_config:
                  seriesName: Standing charge
              - id: c6
                show: false
                apex_config:
                  seriesName: Standing charge
            series:
              # Daily figures come from Octopus's own billed cost sensors (the same numbers as the
              # Octopus dashboard). Their long-term statistics are dated when Octopus publishes each
              # day (about 19:50 the evening after), so each is moved back one day. The first series
              # (the Bought one) does the work and the others read it. It re-runs when the checkbox above is ticked,
              # because that helper is this series' entity.
              - entity: input_boolean.ep_cube_show_standing_charge
                name: Standing charge
                yaxis_id: c0
                type: column
                color: '#90caf9'
                extend_to: false
                show:
                  legend_value: false
                data_generator: |
                  const showS = (hass.states['input_boolean.ep_cube_show_standing_charge'] || {}).state === 'on'; let c = window.__epcMonthDays;
                  for (let k = 0; (!c || c.showS !== showS) && k < 30; k++) { await new Promise(r => setTimeout(r, 100)); c = window.__epcMonthDays; }
                  const rows = c ? await c.p : []; return rows.filter(r => r.has).map(r => [r.ts, r.standing]);
              - entity: input_boolean.ep_cube_show_standing_charge
                name: Bought
                yaxis_id: c1
                type: column
                color: '#42a5f5'
                extend_to: false
                show:
                  legend_value: false
                data_generator: |
                  const KEY = '__epcMonthDays'; const nowT = Date.now(); const showS = (hass.states['input_boolean.ep_cube_show_standing_charge'] || {}).state === 'on'; let c = window[KEY];
                  if (!c || nowT - c.t > 30000 || c.showS !== showS) { c = {t: nowT, showS: showS, p: (async () => {
                    const tz = hass.config.time_zone;
                    const lp = ts => new Intl.DateTimeFormat('en-CA', {timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit'}).format(ts);
                    const d2n = s => Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10)) / 864e5;
                    const n2s = n => new Date(n * 864e5).toISOString().slice(0, 10);
                    const today = lp(nowT); const ms = d2n(today.slice(0, 8) + '01');
                    const y = +today.slice(0, 4), m = +today.slice(5, 7) - 1; const me = Date.UTC(y, m + 1, 0) / 864e5;
                    const IMP = 'sensor.octopus_energy_electricity_19l3564787_2200019819270_previous_accumulative_cost';
                    const EXP = 'sensor.octopus_energy_electricity_19l3564787_2200044183701_export_previous_accumulative_cost';
                    // The standing charge is the sensor's current daily rate. Days before the tariff
                    // changed can have had a different one: list them here as 'last day': rate.
                    const rate = Number(((hass.states[IMP] || {attributes: {}}).attributes || {}).standing_charge) || 0;
                    const OLD_RATES = {'2026-10-07': 0.63};
                    const standingFor = s => { for (const k of Object.keys(OLD_RATES).sort()) if (s <= k) return OLD_RATES[k]; return rate; };
                    const r = await hass.callWS({type: 'recorder/statistics_during_period', start_time: new Date((ms - 3) * 864e5).toISOString(), end_time: new Date(nowT).toISOString(), statistic_ids: [IMP, EXP], period: 'day', types: ['change']});
                    const days = {};
                    for (const [id, rows] of Object.entries(r)) for (const x of rows) { const cov = d2n(lp(x.start)) - 1; (days[cov] = days[cov] || {})[id === IMP ? 'i' : 'e'] = x.change; }
                    // The sensor's own history (kept for about ten days) says exactly which day each figure is for,
                    // through its last_reset attribute, so it overrides the date-shifted statistics where it exists.
                    const hist = {};
                    const h = await hass.callWS({type: 'history/history_during_period', start_time: new Date((ms - 2) * 864e5).toISOString(), end_time: new Date(nowT).toISOString(), entity_ids: [IMP, EXP], minimal_response: false, no_attributes: false, significant_changes_only: false});
                    for (const [id, rows] of Object.entries(h)) for (const x of rows) { const lr = x.a && x.a.last_reset; const val = parseFloat(x.s); if (!lr || !isFinite(val)) continue; const cov = d2n(lp(Date.parse(lr))); (hist[cov] = hist[cov] || {})[id === IMP ? 'i' : 'e'] = val; }
                    const minHist = Math.min(Infinity, ...Object.keys(hist).map(Number));
                    const out = [];
                    for (let d = ms; d <= me; d++) {
                      const v = (d >= minHist ? hist[d] : days[d]) || {}; const s = n2s(d); const total = +(v.i || 0); const billed = total > 0 || +(v.e || 0) > 0;
                      // A day with no figure yet (up to yesterday) still has its standing charge, as on Octopus's own page.
                      const pending = !billed && d <= d2n(today) - 1 && rate > 0;
                      const st = total > 0 ? Math.min(standingFor(s), total) : (pending ? standingFor(s) : 0);
                      const energy = +(total - st).toFixed(2), sold = +(v.e || 0), bought = Math.max(energy, 0) + (showS ? st : 0);
                      out.push({ts: new Date(y, m, d - ms + 1, 12).getTime(), has: billed || (pending && showS), energy: Math.max(energy, 0), standing: showS ? +st.toFixed(2) : 0, sold: -sold, net: +(bought - sold).toFixed(2)});
                    }
                    const lows = out.filter(r => r.has).map(r => Math.min(r.sold, r.net, 0)), highs = out.filter(r => r.has).map(r => Math.max(r.energy + r.standing, r.net, 0));
                    out.range = {min: Math.floor(Math.min(0, ...lows)), max: Math.ceil(Math.max(1, ...highs))};
                    window.__epcMonthRowsData = out;
                    return out; })()}; window[KEY] = c; }
                  const rows = await c.p; return rows.filter(r => r.has).map(r => [r.ts, r.energy]);
              - entity: input_boolean.ep_cube_show_standing_charge
                name: Sold
                yaxis_id: c2
                type: column
                color: '#ab47bc'
                extend_to: false
                show:
                  legend_value: false
                data_generator: |
                  const showS = (hass.states['input_boolean.ep_cube_show_standing_charge'] || {}).state === 'on'; let c = window.__epcMonthDays;
                  for (let k = 0; (!c || c.showS !== showS) && k < 30; k++) { await new Promise(r => setTimeout(r, 100)); c = window.__epcMonthDays; }
                  const rows = c ? await c.p : []; return rows.filter(r => r.has).map(r => [r.ts, r.sold]);
              - entity: input_boolean.ep_cube_show_standing_charge
                name: Net
                yaxis_id: c3
                type: line
                curve: smooth
                color: '#eceff1'
                extend_to: false
                show:
                  legend_value: false
                data_generator: |
                  const showS = (hass.states['input_boolean.ep_cube_show_standing_charge'] || {}).state === 'on'; let c = window.__epcMonthDays;
                  for (let k = 0; (!c || c.showS !== showS) && k < 30; k++) { await new Promise(r => setTimeout(r, 100)); c = window.__epcMonthDays; }
                  const rows = c ? await c.p : []; return rows.filter(r => r.has).map(r => [r.ts, r.net]);
              # Invisible: puts the largest and smallest values on the shared axis so the sold bars (below
              # zero) and the net line are never clipped.
              - entity: input_boolean.ep_cube_show_standing_charge
                name: Range
                yaxis_id: c0
                type: line
                color: '#00000000'
                stroke_width: 0
                extend_to: false
                show:
                  in_legend: false
                  legend_value: false
                data_generator: |
                  const showS = (hass.states['input_boolean.ep_cube_show_standing_charge'] || {}).state === 'on'; let c = window.__epcMonthDays;
                  for (let k = 0; (!c || c.showS !== showS) && k < 30; k++) { await new Promise(r => setTimeout(r, 100)); c = window.__epcMonthDays; }
                  const rows = c ? await c.p : []; const first = rows.find(r => r.has);
                  return first && rows.range ? [[first.ts, rows.range.min], [first.ts, rows.range.max]] : [];
              - entity: input_boolean.ep_cube_show_standing_charge
                name: Spent
                yaxis_id: c5
                type: line
                color: '#ff8a80'
                stroke_width: 0
                extend_to: false
                show:
                  legend_value: false
                data_generator: |
                  const showS = (hass.states['input_boolean.ep_cube_show_standing_charge'] || {}).state === 'on'; let c = window.__epcMonthDays;
                  for (let k = 0; (!c || c.showS !== showS) && k < 30; k++) { await new Promise(r => setTimeout(r, 100)); c = window.__epcMonthDays; }
                  const rows = c ? await c.p : []; return rows.filter(r => r.has && r.net > 0).map(r => [r.ts, r.net]);
              - entity: input_boolean.ep_cube_show_standing_charge
                name: Earned
                yaxis_id: c6
                type: line
                color: '#69f0ae'
                stroke_width: 0
                extend_to: false
                show:
                  legend_value: false
                data_generator: |
                  const showS = (hass.states['input_boolean.ep_cube_show_standing_charge'] || {}).state === 'on'; let c = window.__epcMonthDays;
                  for (let k = 0; (!c || c.showS !== showS) && k < 30; k++) { await new Promise(r => setTimeout(r, 100)); c = window.__epcMonthDays; }
                  const rows = c ? await c.p : []; return rows.filter(r => r.has && r.net < 0).map(r => [r.ts, r.net]);

  - title: Control
    path: control
    icon: mdi:cog
    cards:
      # ───────────────────────────────────────────────────────────────
      # Operating-mode picker + mode-specific controls
      # ───────────────────────────────────────────────────────────────
      # Wrapped in a vertical-stack so HA's masonry treats them as a
      # single unit. Without this, at wider window widths the masonry
      # pushes the conditional settings card into its own column instead
      # of sitting it directly below "Operating mode" — the active
      # settings card now always lives immediately under the picker
      # regardless of viewport.
      #
      # Conditional state values are the select's raw option keys
      # (self_consumption / time_of_use / backup), not the localized
      # display strings — `select` entities expose the key, not the label.
      - type: vertical-stack
        cards:
          - type: entities
            title: Operating mode
            show_header_toggle: false
            entities:
              - entity: select.ep_cube_operating_mode
                name: Mode

          # ───────── Self-consumption mode ─────────
          - type: conditional
            conditions:
              - entity: select.ep_cube_operating_mode
                state: self_consumption
            card:
              type: entities
              title: Self-consumption settings
              show_header_toggle: false
              entities:
                - entity: number.ep_cube_self_consumption_reserve
                  name: Reserve SoC

          # ───────── Backup mode ─────────
          - type: conditional
            conditions:
              - entity: select.ep_cube_operating_mode
                state: backup
            card:
              type: entities
              title: Backup settings
              show_header_toggle: false
              entities:
                - entity: number.ep_cube_backup_reserve
                  name: Reserve SoC

          # ───────── Time-of-use mode ─────────
          # TOU shares the self-consumption reserve as its outside-window
          # fallback (see api.py::_reserve_for_mode). Cube acceptance of
          # that write in TOU mode is provisional — the number entity is
          # permissively available in TOU; if the cube rejects it the
          # WriteVerificationError will surface in the HA log.
          #
          # No in-dashboard TOU schedule editor: from v1.0 the integration
          # is opinionated about Predbat being the single source of truth
          # for TOU. Use the EP Cube mobile app (or Bobsilvio's
          # `bobsilvio/epcube` HACS integration) if you need manual TOU.
          - type: conditional
            conditions:
              - entity: select.ep_cube_operating_mode
                state: time_of_use
            card:
              type: entities
              title: Time-of-use settings
              show_header_toggle: false
              entities:
                - entity: number.ep_cube_self_consumption_reserve
                  name: Reserve SoC
                - entity: switch.ep_cube_allow_charging_from_grid
                  name: Allow charging from grid
                - entity: switch.ep_cube_daylight_saving_time
                  name: Daylight saving time

      # ───────────────────────────────────────────────────────────────
      # Battery health: lifetime discharge and estimated cycles against
      # the warranty allowance (80% capacity for the warranty period or
      # 6,000 cycles). The daily cycle budget comes from the cloud's own
      # warranty dates (the end date is on the Device status card), so a
      # 10-year and a 15-year warranty both read correctly. Estimates from state-of-charge
      # changes, so they may differ slightly from the vendor's count.
      # Needs integration v1.6.2 or later.
      # ───────────────────────────────────────────────────────────────
      - type: entities
        title: Battery health
        show_header_toggle: false
        entities:
          - entity: sensor.ep_cube_battery_discharged_lifetime
            name: Discharged (lifetime)
            icon: mdi:battery-arrow-down-outline
          - entity: sensor.ep_cube_battery_cycles_estimated
            name: Cycles used (of 6,000)
            icon: mdi:battery-sync-outline
          - type: attribute
            entity: sensor.ep_cube_battery_cycles_estimated
            attribute: average_cycles_per_day
            name: Cycles per day (average)
            icon: mdi:speedometer-medium
          - type: attribute
            entity: sensor.ep_cube_battery_cycles_estimated
            attribute: cycle_budget_per_day
            name: Cycles per day (warranty)
            icon: mdi:shield-check-outline

      # ───────────────────────────────────────────────────────────────
      # Device status (live flags) and Device info (fixed facts), stacked so
      # they stay together. The fault/warning code (hidden by default), signal
      # level, system status, charge limit and the rest are diagnostic
      # entities on the device page, not on a card.
      # Needs integration v1.6.3 or later.
      # ───────────────────────────────────────────────────────────────
      - type: vertical-stack
        cards:
          # Traffic-light status: green = fine, amber = unknown or worth a look,
          # red = a fault or the cube is offline. An alert is amber, a fault red.
          - type: custom:html-template-card
            ignore_line_breaks: true
            content: |
              {% macro row(label, text, color, icon) -%}
              <div style="display:flex;align-items:center;justify-content:space-between;padding:6px 0"><div style="display:flex;align-items:center;gap:16px"><ha-icon icon="{{ icon }}" style="color:{{ color }};--mdc-icon-size:24px;display:flex"></ha-icon><span>{{ label }}</span></div><span style="font-weight:500">{{ text }}</span></div>
              {%- endmacro %}
              {% set g = '#43a047' %}{% set a = '#ffb300' %}{% set r = '#e53935' %}
              {% set on = states('binary_sensor.ep_cube_online') %}{% set f = states('binary_sensor.ep_cube_fault') %}{% set al = states('binary_sensor.ep_cube_alert') %}
              <div style="padding:16px 16px 10px"><div style="font-size:24px;line-height:1.2;margin-bottom:8px">Device status</div>
              {{ row('Online', 'Connected' if on == 'on' else ('Offline' if on == 'off' else 'Unknown'), g if on == 'on' else (r if on == 'off' else a), 'mdi:cloud-check-outline' if on == 'on' else ('mdi:cloud-off-outline' if on == 'off' else 'mdi:cloud-question-outline')) }}
              {{ row('Fault', 'OK' if f == 'off' else ('Fault' if f == 'on' else 'Unknown'), g if f == 'off' else (r if f == 'on' else a), 'mdi:check-circle-outline' if f == 'off' else ('mdi:alert-octagon-outline' if f == 'on' else 'mdi:help-circle-outline')) }}
              {{ row('Alert', 'OK' if al == 'off' else ('Alert' if al == 'on' else 'Unknown'), g if al == 'off' else a, 'mdi:check-circle-outline' if al == 'off' else ('mdi:bell-alert-outline' if al == 'on' else 'mdi:help-circle-outline')) }}
              </div>
          - type: entities
            title: Device info
            show_header_toggle: false
            entities:
              - entity: sensor.ep_cube_model
                name: Model
                icon: mdi:tag-text-outline
              - entity: sensor.ep_cube_serial_number
                name: Serial number
                icon: mdi:barcode
              - entity: sensor.ep_cube_firmware_version
                name: Firmware
                icon: mdi:chip
              - entity: sensor.ep_cube_warranty_end_date
                name: Warranty ends
                icon: mdi:shield-check-outline
