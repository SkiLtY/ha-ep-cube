# Native services — 1:1 with cloud API
#
# Mode switching is exposed as select.ep_cube_operating_mode; reserve SoC
# as number.ep_cube_self_consumption_reserve / number.ep_cube_backup_reserve
# (mode-aware available, write pre-check). A native set_operating_mode
# service would just re-invent those writes — call select.select_option /
# number.set_value from automations instead.
set_tou_schedule:
  name: Set TOU schedule
  description: >-
    Replace the cube's time-of-use schedule with new workday + weekend slots.
    DST tier lists, reserves and per-tier prices are preserved. Slot format:
    "HH:MM-HH:MM" (24h, no midnight-crossing). Empty list clears that tier.
    If a Predbat shim override is in flight it will be abandoned (user-wins).
  fields:
    peak_workday:
      name: Workday — peak slots
      description: List of "HH:MM-HH:MM" slots for the workday peak tier.
      required: true
      example: '["16:00-19:00"]'
      selector:
        object:
    mid_peak_workday:
      name: Workday — mid-peak slots
      description: List of "HH:MM-HH:MM" slots for the workday mid-peak tier.
      required: true
      example: '["04:30-16:00", "19:00-23:30"]'
      selector:
        object:
    off_peak_workday:
      name: Workday — off-peak slots
      description: List of "HH:MM-HH:MM" slots for the workday off-peak tier.
      required: true
      example: '["00:30-04:30"]'
      selector:
        object:
    peak_weekend:
      name: Weekend — peak slots
      description: List of "HH:MM-HH:MM" slots for the weekend peak tier.
      required: true
      example: "[]"
      selector:
        object:
    mid_peak_weekend:
      name: Weekend — mid-peak slots
      description: List of "HH:MM-HH:MM" slots for the weekend mid-peak tier.
      required: true
      example: "[]"
      selector:
        object:
    off_peak_weekend:
      name: Weekend — off-peak slots
      description: List of "HH:MM-HH:MM" slots for the weekend off-peak tier.
      required: true
      example: "[]"
      selector:
        object:
    switch_to_tou:
      name: Switch to TOU mode now
      description: If true, also flip the cube's operating mode to Time of Use after writing the schedule.
      required: false
      default: false
      selector:
        boolean:
    device_id:
      name: Device ID
      required: false
      description: Cube devId — only required if multiple EP Cubes are configured.
      selector:
        text:

# Predbat shim services
#
# Phase 2b.1 contract: these services take no parameters beyond an optional
# device_id. The planned window and target SoC are read from Predbat's
# published entities (predbat.best_charge_* / predbat.best_export_*) by the
# handler. Predbat itself fires these services with empty data {}.
#
# Manual invocation from Developer Tools is for diagnostics only — without
# Predbat publishing a plan first, the start/freeze handlers will warn-and-skip.

charge_start:
  name: Predbat — start charging
  description: Force grid charge until the end of Predbat's planned charge window. Reads start/end and target SoC from predbat.best_charge_*.

charge_stop:
  name: Predbat — stop charging
  description: Remove the active grid-charge override and restore baseline schedule.

discharge_start:
  name: Predbat — start discharging
  description: Force grid discharge until the end of Predbat's planned export window. Reads start/end and target SoC from predbat.best_export_*.

discharge_stop:
  name: Predbat — stop discharging
  description: Remove the active discharge override.

charge_freeze:
  name: Predbat — charge freeze
  description: Hold battery at current SoC until the end of Predbat's planned charge window.

discharge_freeze:
  name: Predbat — discharge freeze
  description: Hold battery at current SoC until the end of Predbat's planned discharge window.

idle:
  name: Predbat — idle
  description: Restore the baseline TOU schedule.

# Diagnostic — bypasses Predbat plan reading
debug_freeze:
  name: Debug — freeze for N minutes
  description: Diagnostic only. Snapshots the current cloud baseline, applies a mid-peak TOU slot (battery idle, no grid import, no load support) for the given duration, then auto-reverts. Bypasses Predbat plan reading — use for manually exercising the shim against a live or mock cube.
  fields:
    duration_minutes:
      name: Duration (minutes)
      required: false
      default: 5
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: min
    device_id:
      name: Device ID
      required: false
      description: Cube devId — only required if multiple EP Cubes are configured.
      selector:
        text:
