# Predbat shim services
#
# Note: from v1.0 there is no user-facing TOU writer service. Mode
# switching stays exposed as select.ep_cube_operating_mode; reserve SoC
# as number.ep_cube_self_consumption_reserve / number.ep_cube_backup_reserve
# (mode-aware available, write pre-check). The previous set_tou_schedule
# service was removed — Predbat is the single source of truth for TOU;
# manual TOU painting belongs in the EP Cube mobile app or a different
# integration. If the cube contains user-painted slots, an HA Repair
# issue is raised offering to wipe them and hand control back to Predbat.
#
# Phase 2b.1 contract: these services take no parameters beyond an optional
# device_id. The planned window and target SoC are read from Predbat's
# published entities (predbat.best_charge_* / predbat.best_export_*) by the
# handler. Predbat itself fires these services with empty data {}.
#
# Manual invocation from Developer Tools is for diagnostics only — without
# Predbat publishing a plan first, the start/freeze handlers will warn-and-skip.

charge_start:
  name: Predbat — start charging
  description: Force grid charge until the end of Predbat's planned charge window. Reads start/end and target SoC from predbat.best_charge_*.

charge_stop:
  name: Predbat — stop charging
  description: Remove the active grid-charge override and restore baseline schedule.

discharge_start:
  name: Predbat — start discharging
  description: Force grid discharge until the end of Predbat's planned export window. Reads start/end and target SoC from predbat.best_export_*.

discharge_stop:
  name: Predbat — stop discharging
  description: Remove the active discharge override.

charge_freeze:
  name: Predbat — charge freeze
  description: Hold battery at current SoC until the end of Predbat's planned charge window.

discharge_freeze:
  name: Predbat — discharge freeze
  description: Hold battery at current SoC until the end of Predbat's planned discharge window.

idle:
  name: Predbat — idle
  description: Restore the baseline TOU schedule.

# Diagnostic — bypasses Predbat plan reading
debug_freeze:
  name: Debug — freeze for N minutes
  description: Diagnostic only. Snapshots the current cloud baseline, applies a mid-peak TOU slot (battery idle, no grid import, no load support) for the given duration, then auto-reverts. Bypasses Predbat plan reading — use for manually exercising the shim against a live or mock cube.
  fields:
    duration_minutes:
      name: Duration (minutes)
      required: false
      default: 5
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: min
    device_id:
      name: Device ID
      required: false
      description: Cube devId — only required if multiple EP Cubes are configured.
      selector:
        text:

debug_dynamic_export:
  name: Debug — forced export (Dynamic tariff) for N minutes
  description: Diagnostic only. Snapshots the cloud baseline, switches the cube to Dynamic-tariff mode with a low sell-above threshold so it exports battery energy to the grid at full power until the Reserve SoC, then auto-reverts to the baseline (with a watchdog that confirms the cube left Dynamic mode). Bypasses Predbat plan reading. The cube must already have Dynamic tariff configured in the EP Cube app (Octopus price source, import and sell tariffs).
  fields:
    duration_minutes:
      name: Duration (minutes)
      required: false
      default: 5
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: min
    reserve_pct:
      name: Reserve SoC (%)
      required: false
      default: 50
      description: The export stops at this state of charge. Never below the cube's own self-consumption reserve.
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    device_id:
      name: Device ID
      required: false
      description: Cube devId — only required if multiple EP Cubes are configured.
      selector:
        text:

debug_probe:
  name: Debug — probe a read-only cloud route
  description: Diagnostic only. Makes a GET request to one of a fixed list of read-only cloud routes and returns (and logs) the response, with personal fields masked and long lists shortened. Used to find where data such as the supplier or tariff is stored.
  fields:
    route:
      name: Route
      required: true
      selector:
        select:
          options:
            - device/getSettingsData
            - device/getEarningsConfig
            - device/queryPriceDataGraphV2
            - device/getNewestModeInfo
            - device/getSolarPvPower
            - device/queryDataGraphV2
            - device/getDevPowerCutLog
            - device/netWorkInfo
            - device/getWarranty
            - dynamicPrice/getRelation
            - dynamicPrice/getCountry
            - dynamicPrice/getRegionList
            - dynamicPrice/getBrands
            - dynamicPrice/getProducts
            - vpp/allPrograms
            - vpp/enrollments
            - vpp/events
            - vpp/event
            - vpp/globalEnrollmentStatus
            - vpp/site/programs
            - vpp/site/program
            - vpp/energyhub/program
            - vpp/energyhub/events
            - vpp/energyhub/enrollment
            - vpp/flip/getGlobalSoc
    params:
      name: Extra query parameters
      required: false
      description: "Optional, for example {\"queryDateStr\": \"2026-10-14\", \"scopeType\": \"1\"}. devId is added automatically."
      selector:
        object:
    full:
      name: Full lists
      required: false
      default: false
      selector:
        boolean:
    device_id:
      name: Device ID
      required: false
      description: Cube devId — only required if multiple EP Cubes are configured.
      selector:
        text:
