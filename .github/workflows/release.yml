name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.5.0)"
        required: true

jobs:
  release:
    name: Build & attach release zip
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve tag
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}"
          echo "name=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Verify manifest version matches tag
        run: |
          MANIFEST_VERSION=$(python -c "import json; print(json.load(open('custom_components/ep_cube/manifest.json'))['version'])")
          echo "Tag version:      ${{ steps.tag.outputs.version }}"
          echo "Manifest version: ${MANIFEST_VERSION}"
          if [ "${{ steps.tag.outputs.version }}" != "${MANIFEST_VERSION}" ]; then
            echo "::error::Tag ${{ steps.tag.outputs.name }} does not match manifest.json version ${MANIFEST_VERSION}. Bump the manifest before tagging."
            exit 1
          fi

      - name: Verify curated release notes exist
        run: |
          NOTES_FILE="docs/RELEASE_NOTES_${{ steps.tag.outputs.name }}.md"
          if [ ! -f "${NOTES_FILE}" ]; then
            echo "::error::Missing curated release notes at ${NOTES_FILE}. Add the file before tagging — release.yml is wired to read body from there (no auto-generated commit-log fallback)."
            exit 1
          fi
          echo "Using release notes: ${NOTES_FILE}"

      - name: Build zip
        run: |
          cd custom_components/ep_cube
          zip -r ../../ep_cube.zip . -x "__pycache__/*" "*/__pycache__/*" "*.pyc"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          body_path: docs/RELEASE_NOTES_${{ steps.tag.outputs.name }}.md
          files: ep_cube.zip
