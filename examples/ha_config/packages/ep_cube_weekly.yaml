# Week-to-date and month-to-date totals for the EP Cube dashboard's Week and Month tabs.
#
# The integration only exposes "today" and "yesterday" figures. The totals below
# add up finished days: once a day an automation adds yesterday's final figure to
# a running total, and the week/month sensors show that total plus today's live
# figure. (A utility_meter on the *_today sensors was tried first; it counts every
# dip in a cloud counter as a reset and so over-counted, 'consumed' by about 15%
# in one month.) Weekly totals reset on Monday, monthly ones on the 1st. Drop this
# file next to ep_cube.yaml in /config/packages/ and restart.
#
# BEFORE YOU USE IT: the two billed-cost sources in the automations near the
# bottom contain your Octopus meter serial and MPAN. Replace the <...> parts
# with the ones in your own entity names (Developer tools > States, search
# "previous_accumulative_cost").
# Money: Octopus's billed cost for each day, summed per week and per month.
#
# The Octopus Energy integration's *_previous_accumulative_cost sensors hold ONE
# day's total at a time and replace it once a day (around 19:50, for the day
# before). A utility_meter can't sum that: it only adds increases, so a day
# cheaper than the one before it is silently dropped. Instead an automation adds
# each day's figure to running totals. The sensor's last_reset (the start of the
# day it covers) says which day a figure belongs to, and a figure that is revised
# later (Octopus sometimes publishes a partial day first) only adds the
# difference, so nothing is counted twice, restarts included. Only days in the
# current Monday-Sunday week (or the current month) are counted, so the totals lag
# by a day or two; that is Octopus's publishing delay.
#
# Import is kept twice: with the standing charge (what you are billed) and
# without it (the energy only, from the sensor's total_without_standing_charge
# attribute). Export has no standing charge.
input_number:
  ep_cube_week_billed_import_total:
    name: EP Cube week billed import incl. standing charge (running total)
    min: 0
    max: 100000
    step: 0.01
    mode: box
    unit_of_measurement: GBP
  ep_cube_week_billed_import_energy_total:
    name: EP Cube week billed import energy only (running total)
    min: 0
    max: 100000
    step: 0.01
    mode: box
    unit_of_measurement: GBP
  ep_cube_week_billed_export_total:
    name: EP Cube week billed export (running total)
    min: 0
    max: 100000
    step: 0.01
    mode: box
    unit_of_measurement: GBP
  ep_cube_month_billed_import_total:
    name: EP Cube month billed import incl. standing charge (running total)
    min: 0
    max: 100000
    step: 0.01
    mode: box
    unit_of_measurement: GBP
  ep_cube_month_billed_import_energy_total:
    name: EP Cube month billed import energy only (running total)
    min: 0
    max: 100000
    step: 0.01
    mode: box
    unit_of_measurement: GBP
  ep_cube_month_billed_export_total:
    name: EP Cube month billed export (running total)
    min: 0
    max: 100000
    step: 0.01
    mode: box
    unit_of_measurement: GBP
  ep_cube_week_solar_total:
    name: EP Cube week solar (finished days, kWh)
    min: 0
    max: 1000000
    step: 0.01
    mode: box
    unit_of_measurement: kWh
  ep_cube_week_import_total:
    name: EP Cube week grid import (finished days, kWh)
    min: 0
    max: 1000000
    step: 0.01
    mode: box
    unit_of_measurement: kWh
  ep_cube_week_export_total:
    name: EP Cube week grid export (finished days, kWh)
    min: 0
    max: 1000000
    step: 0.01
    mode: box
    unit_of_measurement: kWh
  ep_cube_week_consumed_total:
    name: EP Cube week consumed (finished days, kWh)
    min: 0
    max: 1000000
    step: 0.01
    mode: box
    unit_of_measurement: kWh
  ep_cube_month_solar_total:
    name: EP Cube month solar (finished days, kWh)
    min: 0
    max: 1000000
    step: 0.01
    mode: box
    unit_of_measurement: kWh
  ep_cube_month_import_total:
    name: EP Cube month grid import (finished days, kWh)
    min: 0
    max: 1000000
    step: 0.01
    mode: box
    unit_of_measurement: kWh
  ep_cube_month_export_total:
    name: EP Cube month grid export (finished days, kWh)
    min: 0
    max: 1000000
    step: 0.01
    mode: box
    unit_of_measurement: kWh
  ep_cube_month_consumed_total:
    name: EP Cube month consumed (finished days, kWh)
    min: 0
    max: 1000000
    step: 0.01
    mode: box
    unit_of_measurement: kWh
  ep_cube_standing_charge:
    name: EP Cube standing charge per day (from Octopus)
    min: 0
    max: 10
    step: 0.0001
    mode: box
    unit_of_measurement: GBP

# The Month tab's "Show standing charge" checkbox: adds the standing charge to each
# day's bought bar and to the net line.
input_boolean:
  ep_cube_show_standing_charge:
    name: Show standing charge
    icon: mdi:cash-plus

# The most recent day already added, as "<last_reset>|<amount>|<energy only>", per direction.
input_text:
  ep_cube_billed_import_last:
    name: EP Cube billed import (last day counted)
    max: 120
  ep_cube_billed_export_last:
    name: EP Cube billed export (last day counted)
    max: 120
  ep_cube_energy_last_day:
    name: EP Cube energy totals (last day added)
    max: 20

template:
  # The dashboard reads these sensors.
  - sensor:
      - name: "ep_cube_week_billed_import"
        unique_id: ep_cube_week_billed_import
        unit_of_measurement: GBP
        device_class: monetary
        # Octopus counts a day's standing charge before that day's figure is published, so the
        # days still to come are added at the current daily rate.
        state: >
          {% set last = as_datetime(states('input_text.ep_cube_billed_import_last').split('|')[0], none) %}
          {% set before = (now() - timedelta(days=now().weekday())).date() - timedelta(days=1) %}
          {% set counted = [(last | as_local).date(), before] | max if last is not none else before %}
          {% set pending = [((now() - timedelta(days=1)).date() - counted).days, 0] | max %}
          {{ (states('input_number.ep_cube_week_billed_import_total') | float(0) + states('input_number.ep_cube_standing_charge') | float(0) * pending) | round(2) }}
      - name: "ep_cube_week_billed_import_energy"
        unique_id: ep_cube_week_billed_import_energy
        unit_of_measurement: GBP
        device_class: monetary
        state: "{{ states('input_number.ep_cube_week_billed_import_energy_total') | float(0) | round(2) }}"
      - name: "ep_cube_week_billed_export"
        unique_id: ep_cube_week_billed_export
        unit_of_measurement: GBP
        device_class: monetary
        state: "{{ states('input_number.ep_cube_week_billed_export_total') | float(0) | round(2) }}"
      - name: "ep_cube_month_billed_import"
        unique_id: ep_cube_month_billed_import
        unit_of_measurement: GBP
        device_class: monetary
        # Octopus counts a day's standing charge before that day's figure is published, so the
        # days still to come are added at the current daily rate.
        state: >
          {% set last = as_datetime(states('input_text.ep_cube_billed_import_last').split('|')[0], none) %}
          {% set before = now().replace(day=1).date() - timedelta(days=1) %}
          {% set counted = [(last | as_local).date(), before] | max if last is not none else before %}
          {% set pending = [((now() - timedelta(days=1)).date() - counted).days, 0] | max %}
          {{ (states('input_number.ep_cube_month_billed_import_total') | float(0) + states('input_number.ep_cube_standing_charge') | float(0) * pending) | round(2) }}
      - name: "ep_cube_month_billed_import_energy"
        unique_id: ep_cube_month_billed_import_energy
        unit_of_measurement: GBP
        device_class: monetary
        state: "{{ states('input_number.ep_cube_month_billed_import_energy_total') | float(0) | round(2) }}"
      - name: "ep_cube_month_billed_export"
        unique_id: ep_cube_month_billed_export
        unit_of_measurement: GBP
        device_class: monetary
        state: "{{ states('input_number.ep_cube_month_billed_export_total') | float(0) | round(2) }}"
      - name: "ep_cube_week_solar"
        unique_id: ep_cube_week_solar
        unit_of_measurement: kWh
        device_class: energy
        state: "{{ (states('input_number.ep_cube_week_solar_total') | float(0) + states('sensor.ep_cube_solar_today') | float(0)) | round(2) }}"
      - name: "ep_cube_week_import"
        unique_id: ep_cube_week_import
        unit_of_measurement: kWh
        device_class: energy
        state: "{{ (states('input_number.ep_cube_week_import_total') | float(0) + states('sensor.ep_cube_grid_import_today') | float(0)) | round(2) }}"
      - name: "ep_cube_week_export"
        unique_id: ep_cube_week_export
        unit_of_measurement: kWh
        device_class: energy
        state: "{{ (states('input_number.ep_cube_week_export_total') | float(0) + states('sensor.ep_cube_grid_export_today') | float(0)) | round(2) }}"
      - name: "ep_cube_week_consumed"
        unique_id: ep_cube_week_consumed
        unit_of_measurement: kWh
        device_class: energy
        state: "{{ (states('input_number.ep_cube_week_consumed_total') | float(0) + states('sensor.ep_cube_backup_loads_today') | float(0)) | round(2) }}"
      - name: "ep_cube_month_solar"
        unique_id: ep_cube_month_solar
        unit_of_measurement: kWh
        device_class: energy
        state: "{{ (states('input_number.ep_cube_month_solar_total') | float(0) + states('sensor.ep_cube_solar_today') | float(0)) | round(2) }}"
      - name: "ep_cube_month_import"
        unique_id: ep_cube_month_import
        unit_of_measurement: kWh
        device_class: energy
        state: "{{ (states('input_number.ep_cube_month_import_total') | float(0) + states('sensor.ep_cube_grid_import_today') | float(0)) | round(2) }}"
      - name: "ep_cube_month_export"
        unique_id: ep_cube_month_export
        unit_of_measurement: kWh
        device_class: energy
        state: "{{ (states('input_number.ep_cube_month_export_total') | float(0) + states('sensor.ep_cube_grid_export_today') | float(0)) | round(2) }}"
      - name: "ep_cube_month_consumed"
        unique_id: ep_cube_month_consumed
        unit_of_measurement: kWh
        device_class: energy
        state: "{{ (states('input_number.ep_cube_month_consumed_total') | float(0) + states('sensor.ep_cube_backup_loads_today') | float(0)) | round(2) }}"

automation:
  - id: ep_cube_billed_import_add
    alias: "EP Cube: add Octopus billed import to the week and month"
    mode: queued
    triggers:
      # Replace with your own import sensor (serial and import MPAN).
      - trigger: state
        entity_id: sensor.octopus_energy_electricity_<SERIAL>_<IMPORT_MPAN>_previous_accumulative_cost
    conditions:
      - condition: template
        value_template: >
          {% set s = trigger.to_state %}
          {{ s is not none and (s.state | is_number) and s.attributes.last_reset is not none
             and (as_datetime(s.attributes.last_reset) | as_local).strftime('%Y-%m-%d')
                 >= now().strftime('%Y-%m-01') }}
    actions:
      - variables:
          lr: "{{ trigger.to_state.attributes.last_reset | string }}"
          amount: "{{ trigger.to_state.state | float(0) }}"
          energy: "{{ trigger.to_state.attributes.get('total_without_standing_charge', trigger.to_state.state) | float(0) }}"
          day: "{{ (as_datetime(lr) | as_local).strftime('%Y-%m-%d') }}"
          prev: "{{ states('input_text.ep_cube_billed_import_last').split('|') }}"
          # Compare calendar days, not the stored text: after an Octopus reload the sensor can
          # hand over the same last_reset in another notation ("2026-10-18 00:00:00+01:00" for
          # "2026-10-17T23:00:00+00:00"), and a text comparison would then add the day again.
          prev_day: "{{ (as_datetime(prev[0], none) | as_local).strftime('%Y-%m-%d') if prev | length > 1 and as_datetime(prev[0], none) is not none else '' }}"
          same_day: "{{ prev_day == day }}"
          prev_amount: "{{ prev[1] | float(0) if same_day else 0 }}"
          prev_energy: "{{ (prev[2] if prev | length > 2 else prev[1]) | float(0) if same_day else 0 }}"
          d_amount: "{{ (amount - prev_amount) | round(2) }}"
          d_energy: "{{ (energy - prev_energy) | round(2) }}"
          in_week: "{{ day >= (now() - timedelta(days=now().weekday())).strftime('%Y-%m-%d') }}"
          in_month: "{{ day >= now().strftime('%Y-%m-01') }}"
      - condition: template
        value_template: "{{ d_amount != 0 or d_energy != 0 }}"
      - if:
          - condition: template
            value_template: "{{ in_week }}"
        then:
          - action: input_number.set_value
            target:
              entity_id: input_number.ep_cube_week_billed_import_total
            data:
              value: "{{ ([states('input_number.ep_cube_week_billed_import_total') | float(0) + d_amount, 0] | max) | round(2) }}"
          - action: input_number.set_value
            target:
              entity_id: input_number.ep_cube_week_billed_import_energy_total
            data:
              value: "{{ ([states('input_number.ep_cube_week_billed_import_energy_total') | float(0) + d_energy, 0] | max) | round(2) }}"
      - if:
          - condition: template
            value_template: "{{ in_month }}"
        then:
          - action: input_number.set_value
            target:
              entity_id: input_number.ep_cube_month_billed_import_total
            data:
              value: "{{ ([states('input_number.ep_cube_month_billed_import_total') | float(0) + d_amount, 0] | max) | round(2) }}"
          - action: input_number.set_value
            target:
              entity_id: input_number.ep_cube_month_billed_import_energy_total
            data:
              value: "{{ ([states('input_number.ep_cube_month_billed_import_energy_total') | float(0) + d_energy, 0] | max) | round(2) }}"
      - if:
          - condition: template
            value_template: "{{ trigger.to_state.attributes.get('standing_charge') is number }}"
        then:
          - action: input_number.set_value
            target:
              entity_id: input_number.ep_cube_standing_charge
            data:
              value: "{{ trigger.to_state.attributes.standing_charge }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.ep_cube_billed_import_last
        data:
          value: "{{ lr }}|{{ amount }}|{{ energy }}"

  - id: ep_cube_billed_export_add
    alias: "EP Cube: add Octopus billed export to the week and month"
    mode: queued
    triggers:
      # Replace with your own export sensor (serial and export MPAN).
      - trigger: state
        entity_id: sensor.octopus_energy_electricity_<SERIAL>_<EXPORT_MPAN>_export_previous_accumulative_cost
    conditions:
      - condition: template
        value_template: >
          {% set s = trigger.to_state %}
          {{ s is not none and (s.state | is_number) and s.attributes.last_reset is not none
             and (as_datetime(s.attributes.last_reset) | as_local).strftime('%Y-%m-%d')
                 >= now().strftime('%Y-%m-01') }}
    actions:
      - variables:
          lr: "{{ trigger.to_state.attributes.last_reset | string }}"
          amount: "{{ trigger.to_state.state | float(0) }}"
          day: "{{ (as_datetime(lr) | as_local).strftime('%Y-%m-%d') }}"
          prev: "{{ states('input_text.ep_cube_billed_export_last').split('|') }}"
          # Calendar days, not text: see the import automation above.
          prev_day: "{{ (as_datetime(prev[0], none) | as_local).strftime('%Y-%m-%d') if prev | length > 1 and as_datetime(prev[0], none) is not none else '' }}"
          same_day: "{{ prev_day == day }}"
          prev_amount: "{{ prev[1] | float(0) if same_day else 0 }}"
          d_amount: "{{ (amount - prev_amount) | round(2) }}"
          in_week: "{{ day >= (now() - timedelta(days=now().weekday())).strftime('%Y-%m-%d') }}"
          in_month: "{{ day >= now().strftime('%Y-%m-01') }}"
      - condition: template
        value_template: "{{ d_amount != 0 }}"
      - if:
          - condition: template
            value_template: "{{ in_week }}"
        then:
          - action: input_number.set_value
            target:
              entity_id: input_number.ep_cube_week_billed_export_total
            data:
              value: "{{ ([states('input_number.ep_cube_week_billed_export_total') | float(0) + d_amount, 0] | max) | round(2) }}"
      - if:
          - condition: template
            value_template: "{{ in_month }}"
        then:
          - action: input_number.set_value
            target:
              entity_id: input_number.ep_cube_month_billed_export_total
            data:
              value: "{{ ([states('input_number.ep_cube_month_billed_export_total') | float(0) + d_amount, 0] | max) | round(2) }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.ep_cube_billed_export_last
        data:
          value: "{{ lr }}|{{ amount }}"

  # Once a day, add yesterday's final energy figures (the cube's own *_yesterday sensors) to
  # the week and month totals. The hourly check also catches up after Home Assistant was off
  # at 01:20, and the stored date means a day is never added twice.
  - id: ep_cube_energy_rollup
    alias: "EP Cube: add yesterday's energy to the week and month"
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: "20"
      - trigger: homeassistant
        event: start
    conditions:
      - condition: template
        value_template: >
          {{ now().hour >= 1
             and states('sensor.ep_cube_backup_loads_yesterday') | float(0) > 1
             and (now() - timedelta(days=1)).strftime('%Y-%m-%d') != states('input_text.ep_cube_energy_last_day') }}
    actions:
      - variables:
          day: "{{ (now() - timedelta(days=1)).strftime('%Y-%m-%d') }}"
          in_week: "{{ day >= (now() - timedelta(days=now().weekday())).strftime('%Y-%m-%d') }}"
          in_month: "{{ day >= now().strftime('%Y-%m-01') }}"
      - if:
          - condition: template
            value_template: "{{ in_week }}"
        then:
          - action: input_number.set_value
            target:
              entity_id: input_number.ep_cube_week_solar_total
            data:
              value: "{{ (states('input_number.ep_cube_week_solar_total') | float(0) + states('sensor.ep_cube_solar_yesterday') | float(0)) | round(2) }}"
          - action: input_number.set_value
            target:
              entity_id: input_number.ep_cube_week_import_total
            data:
              value: "{{ (states('input_number.ep_cube_week_import_total') | float(0) + states('sensor.ep_cube_grid_import_yesterday') | float(0)) | round(2) }}"
          - action: input_number.set_value
            target:
              entity_id: input_number.ep_cube_week_export_total
            data:
              value: "{{ (states('input_number.ep_cube_week_export_total') | float(0) + states('sensor.ep_cube_grid_export_yesterday') | float(0)) | round(2) }}"
          - action: input_number.set_value
            target:
              entity_id: input_number.ep_cube_week_consumed_total
            data:
              value: "{{ (states('input_number.ep_cube_week_consumed_total') | float(0) + states('sensor.ep_cube_backup_loads_yesterday') | float(0)) | round(2) }}"
      - if:
          - condition: template
            value_template: "{{ in_month }}"
        then:
          - action: input_number.set_value
            target:
              entity_id: input_number.ep_cube_month_solar_total
            data:
              value: "{{ (states('input_number.ep_cube_month_solar_total') | float(0) + states('sensor.ep_cube_solar_yesterday') | float(0)) | round(2) }}"
          - action: input_number.set_value
            target:
              entity_id: input_number.ep_cube_month_import_total
            data:
              value: "{{ (states('input_number.ep_cube_month_import_total') | float(0) + states('sensor.ep_cube_grid_import_yesterday') | float(0)) | round(2) }}"
          - action: input_number.set_value
            target:
              entity_id: input_number.ep_cube_month_export_total
            data:
              value: "{{ (states('input_number.ep_cube_month_export_total') | float(0) + states('sensor.ep_cube_grid_export_yesterday') | float(0)) | round(2) }}"
          - action: input_number.set_value
            target:
              entity_id: input_number.ep_cube_month_consumed_total
            data:
              value: "{{ (states('input_number.ep_cube_month_consumed_total') | float(0) + states('sensor.ep_cube_backup_loads_yesterday') | float(0)) | round(2) }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.ep_cube_energy_last_day
        data:
          value: "{{ day }}"

  - id: ep_cube_billed_week_reset
    alias: "EP Cube: reset the weekly billed totals on Monday"
    triggers:
      - trigger: time
        at: "00:00:00"
    conditions:
      - condition: time
        weekday:
          - mon
    actions:
      - action: input_number.set_value
        target:
          entity_id:
            - input_number.ep_cube_week_billed_import_total
            - input_number.ep_cube_week_billed_import_energy_total
            - input_number.ep_cube_week_billed_export_total
            - input_number.ep_cube_week_solar_total
            - input_number.ep_cube_week_import_total
            - input_number.ep_cube_week_export_total
            - input_number.ep_cube_week_consumed_total
        data:
          value: 0

  - id: ep_cube_billed_month_reset
    alias: "EP Cube: reset the monthly billed totals on the 1st"
    triggers:
      - trigger: time
        at: "00:00:00"
    conditions:
      - condition: template
        value_template: "{{ now().day == 1 }}"
    actions:
      - action: input_number.set_value
        target:
          entity_id:
            - input_number.ep_cube_month_billed_import_total
            - input_number.ep_cube_month_billed_import_energy_total
            - input_number.ep_cube_month_billed_export_total
            - input_number.ep_cube_month_solar_total
            - input_number.ep_cube_month_import_total
            - input_number.ep_cube_month_export_total
            - input_number.ep_cube_month_consumed_total
        data:
          value: 0
