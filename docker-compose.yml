services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: ha-ep-cube-ha
    restart: unless-stopped
    ports:
      - "8123:8123"
    volumes:
      - ./ha_config:/config
      - ./custom_components/ep_cube:/config/custom_components/ep_cube
    depends_on:
      - mock
    environment:
      - TZ=Europe/London

  mock:
    build:
      context: ./mock_server
    container_name: ha-ep-cube-mock
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      - PYTHONUNBUFFERED=1

  appdaemon:
    build:
      context: ./appdaemon
    image: ha-ep-cube-appdaemon:local
    container_name: ha-ep-cube-appdaemon
    restart: unless-stopped
    ports:
      - "5050:5050"
    volumes:
      - ./appdaemon_config:/conf
      # Mount only Predbat's Python package into /conf/apps/predbat as a real
      # directory. (Symlinks aren't followed by AppDaemon's os.walk(), so the
      # module never gets imported.) The rest of the Predbat clone — including
      # its requirements.txt — is intentionally invisible to the container, so
      # AppDaemon's auto-pip step skips it.
      - ./predbat-source/apps/predbat:/conf/apps/predbat:ro
    depends_on:
      - homeassistant
    environment:
      - TZ=Europe/London
      - HA_URL=http://homeassistant:8123
      - DASH_URL=http://0.0.0.0:5050
