services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: ha-ep-cube-ha
    restart: unless-stopped
    ports:
      - "8123:8123"
    volumes:
      - ./ha_config:/config
      - ./custom_components/ep_cube:/config/custom_components/ep_cube
    depends_on:
      - mock
    environment:
      - TZ=Europe/London

  mock:
    build:
      context: ./mock_server
    container_name: ha-ep-cube-mock
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      - PYTHONUNBUFFERED=1

  # Predbat as a standalone Docker service. Upstream Predbat retired the
  # AppDaemon install path; nipar44/predbat_addon is the Docker fork they
  # point at. apps.yaml + secrets.yaml live in ./predbat_config/.
  predbat:
    image: nipar44/predbat_addon:alpine-latest
    container_name: ha-ep-cube-predbat
    restart: unless-stopped
    ports:
      - "5052:5052"
    volumes:
      - ./predbat_config:/config:rw
    depends_on:
      - homeassistant
    environment:
      - TZ=Europe/London
