services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: ha-ep-cube-ha
    restart: unless-stopped
    ports:
      - "8123:8123"
    volumes:
      - ./ha_config:/config
      - ./custom_components/ep_cube:/config/custom_components/ep_cube
    depends_on:
      - mock
    environment:
      - TZ=Europe/London

  mock:
    build:
      context: ./mock_server
    container_name: ha-ep-cube-mock
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      - PYTHONUNBUFFERED=1

# Notes for contributors:
#   - First `docker compose up -d` will create an empty ./ha_config/ that
#     HA initialises on first boot. Add the integration via HA's UI and
#     point it at `http://mock:8765` (Docker DNS), any username/password,
#     device_id `ep_cube_test_01`.
#   - Production deployments that also run Predbat add a
#     docker-compose.override.yml with the predbat service + real volume
#     mounts; compose auto-merges both files.
